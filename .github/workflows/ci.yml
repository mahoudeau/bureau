# CI: boot a scratch hub and run the curl-only conformance scripts against it.
# No npm install anywhere: the hub has zero dependencies, so a bare Node is enough.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUREAU_URL: http://127.0.0.1:8100
      BUREAU_TOKEN: devtoken
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS matches production (alwaysdata). The hub needs Node 18 or
      # newer: global fetch (lib/poke.js, lib/discord.js) and structuredClone
      # (lib/store.js).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start a scratch hub
        run: |
          mkdir -p "$RUNNER_TEMP/bureau"
          PORT=8100 \
          BUREAU_DATA_DIR="$RUNNER_TEMP/bureau/data" \
          BUREAU_BRAIN_DIR="$RUNNER_TEMP/bureau/brain" \
          BUREAU_RESERVATION_TTL_MIN=0.02 \
            nohup node hub/server.js > "$RUNNER_TEMP/bureau/hub.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$BUREAU_URL/health" > /dev/null && exit 0
            sleep 0.5
          done
          echo "hub never answered /health"
          cat "$RUNNER_TEMP/bureau/hub.log"
          exit 1

      # Against the scratch hub above, which must be fresh (RUNNER_TEMP is, per
      # job). BUREAU_RESERVATION_TTL_MIN=0.02 is what its reservation-lapse
      # check needs (section 8); CONF_BRAIN_DIR turns on the intake sweep
      # checks (section 8e), which drop files straight into the hub's brain.
      - name: Conformance (test/dummy-agent.sh)
        run: CONF_BRAIN_DIR="$RUNNER_TEMP/bureau/brain" bash test/dummy-agent.sh

      - name: Brain lint (test/brain-lint.sh)
        run: bash test/brain-lint.sh

      # Self-contained: starts its own hubs and sink on ports 8196 to 8199.
      - name: Pokes (test/pokes.sh)
        run: sh test/pokes.sh

      # Storage tests land separately (test/storage.sh). Check its header for
      # how it wants to be run, then uncomment.
      # - name: Storage (test/storage.sh)
      #   run: bash test/storage.sh

      - name: Hub log
        if: always()
        run: cat "$RUNNER_TEMP/bureau/hub.log" || true
