# CI: boot a scratch hub and run the curl-only conformance scripts against it.
# No npm install anywhere: the hub has zero dependencies, so a bare Node is enough.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUREAU_URL: http://127.0.0.1:8100
      BUREAU_TOKEN: devtoken
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS matches production (alwaysdata). The hub needs Node 18 or
      # newer: global fetch (lib/poke.js, lib/discord.js) and structuredClone
      # (lib/store.js).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start a scratch hub
        run: |
          mkdir -p "$RUNNER_TEMP/bureau"
          PORT=8100 \
          BUREAU_DATA_DIR="$RUNNER_TEMP/bureau/data" \
          BUREAU_BRAIN_DIR="$RUNNER_TEMP/bureau/brain" \
          BUREAU_WORK_DIR="$RUNNER_TEMP/bureau/work" \
          BUREAU_RESERVATION_TTL_MIN=0.02 \
            nohup node hub/server.js > "$RUNNER_TEMP/bureau/hub.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$BUREAU_URL/health" > /dev/null && exit 0
            sleep 0.5
          done
          echo "hub never answered /health"
          cat "$RUNNER_TEMP/bureau/hub.log"
          exit 1

      # Against the scratch hub above, which must be fresh (RUNNER_TEMP is, per
      # job). BUREAU_RESERVATION_TTL_MIN=0.02 on the hub plus CONF_SHORT_TTL
      # here turn on the reservation-lapse check (section 8); CONF_BRAIN_DIR
      # turns on the intake sweep checks (section 8e), which drop files
      # straight into the hub's brain.
      - name: Conformance (test/dummy-agent.sh)
        run: CONF_SHORT_TTL=1 CONF_BRAIN_DIR="$RUNNER_TEMP/bureau/brain" bash test/dummy-agent.sh

      - name: Brain lint (test/brain-lint.sh)
        run: bash test/brain-lint.sh

      # Retrieval on the fixture brain: recall@5 on test/memory-eval/example.json
      # must not drop below the number recorded in the script. Self-contained:
      # starts its own hub on port 4742.
      - name: Memory eval (test/memory-eval.sh)
        run: bash test/memory-eval.sh

      # Brain Format v0.3 claims: fixtures with their expected parse, read by
      # hub/lib/claims.js and written back byte for byte.
      - name: Claims format (test/claims.test.js)
        run: node test/claims.test.js

      # Journal records: generated records with awkward characters, written
      # then read back unchanged.
      - name: Journal round trip (test/journal.test.js)
        run: node test/journal.test.js

      # Self-contained: starts its own hubs and sink on ports 8196 to 8199.
      - name: Pokes (test/pokes.sh)
        run: sh test/pokes.sh

      # The Discord notify policy: a decision table and an end-to-end run
      # against a local sink, no webhook needed.
      - name: Notify (test/notify.test.js)
        run: node test/notify.test.js

      # Approval pins the text: a payload edited in state.json after filing
      # fails the hash. Self-contained: starts its own hub on port 8192.
      - name: Apply (test/apply.test.js)
        run: node test/apply.test.js

      # Self-contained: starts its own hubs on ports 4711 and 4712.
      - name: Storage (test/storage.sh)
        run: bash test/storage.sh

      - name: Hub log
        if: always()
        run: cat "$RUNNER_TEMP/bureau/hub.log" || true

  # The office regression guard: every draw stays on the 384x216 canvas and
  # every pixel is one of the palette's 4 shades, at every phase and view.
  # Playwright and Chromium are installed in CI only; the hub itself keeps
  # zero dependencies.
  office-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1

      - name: Install Playwright and Chromium (CI only)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      - name: Start a scratch hub
        run: |
          mkdir -p "$RUNNER_TEMP/office"
          PORT=4714 BUREAU_TOKEN=demo \
          BUREAU_DATA_DIR="$RUNNER_TEMP/office/data" \
          BUREAU_BRAIN_DIR="$RUNNER_TEMP/office/brain" \
            nohup node hub/server.js > "$RUNNER_TEMP/office/hub.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4714/health > /dev/null && exit 0
            sleep 0.5
          done
          echo "hub never answered /health"
          cat "$RUNNER_TEMP/office/hub.log"
          exit 1

      - name: Office guard (test/office-guard.sh)
        run: BASE=http://127.0.0.1:4714 TOKEN=demo bash test/office-guard.sh

      - name: Hub log
        if: always()
        run: cat "$RUNNER_TEMP/office/hub.log" || true

  # Windows, the way a Windows user runs it: a .env saved by PowerShell (CRLF
  # and a BOM), then plain `node server.js`, no shell wrapper. The checkout
  # keeps the runner's default core.autocrlf=true on purpose: .gitattributes
  # has to keep the scripts and fixtures LF, and the tests fail if it does not.
  # Linux only, on purpose: storage.sh and pokes.sh need lsof, POSIX pids and
  # signals (platform.test.js covers their Windows side: the lock and the
  # state flush), and office-guard needs Playwright and Chromium.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Windows PowerShell 5.1: Set-Content -Encoding UTF8 writes CRLF lines
      # and a BOM, the worst case a Notepad user hands the hub. No BUREAU_TOKEN
      # in this step's environment: the 401 below proves it came from hub\.env.
      # The runner ends a step's processes with the step on Windows, so this
      # hub only proves the .env; the conformance step starts its own.
      - name: node server.js reads a PowerShell .env
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bureau'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path hub\.env -Encoding UTF8 -Value @(
            '# Bureau: environment, written by PowerShell',
            'BUREAU_TOKEN=devtoken',
            'PORT=8100',
            'HOST=127.0.0.1',
            "BUREAU_DATA_DIR=$dir\data",
            "BUREAU_BRAIN_DIR=$dir\brain",
            "BUREAU_WORK_DIR=$dir\work",
            'BUREAU_RESERVATION_TTL_MIN=0.02'
          )
          $hub = Start-Process -FilePath node -ArgumentList 'server.js' -WorkingDirectory (Resolve-Path hub).Path -PassThru `
            -RedirectStandardOutput "$dir\env-check.log" -RedirectStandardError "$dir\env-check.err.log"
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            curl.exe -sf http://127.0.0.1:8100/health | Out-Null
            if ($LASTEXITCODE -eq 0) { $up = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $up) {
            Write-Output 'hub never answered /health'
            Get-Content "$dir\env-check.log", "$dir\env-check.err.log"
            exit 1
          }
          $code = curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:8100/api/health
          Stop-Process -Id $hub.Id -Force
          if ($code -ne '401') {
            Write-Output "the token in hub\.env is not in force: /api/health without it answered $code"
            Get-Content "$dir\env-check.log", "$dir\env-check.err.log"
            exit 1
          }
          Start-Sleep -Seconds 1
          # the stop was a hard kill: the next hub takes over the lock
          exit 0

      # Git Bash, curl only, against a hub started in this same step (from
      # the repo root, so hub\.env is found whatever the working directory):
      # it drives the hub's Windows runtime (paths, git.exe, the brain, the
      # work store). Same options as the Linux conformance job; cygpath turns
      # RUNNER_TEMP (D:\a\_temp) into a path Git Bash's own tools take. A hub
      # that never answers fails the step at once, not at the job's timeout.
      - name: Conformance (test/dummy-agent.sh)
        shell: bash
        env:
          BUREAU_URL: http://127.0.0.1:8100
          BUREAU_TOKEN: devtoken
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")/bureau"
          node hub/server.js > "$T/hub.log" 2> "$T/hub.err.log" &
          for i in $(seq 1 60); do curl -sf -m 2 "$BUREAU_URL/health" > /dev/null && break; sleep 0.5; done
          curl -sf -m 2 "$BUREAU_URL/health" > /dev/null || { echo 'hub never answered /health'; cat "$T/hub.log" "$T/hub.err.log"; exit 1; }
          CONF_SHORT_TTL=1 CONF_BRAIN_DIR="$T/brain" bash test/dummy-agent.sh

      # The node tests start their own hubs on their own ports, and skip
      # hub\.env (BUREAU_ENV_FILE), except platform.test.js, which copies hub/.
      - name: Platform (test/platform.test.js)
        run: node test/platform.test.js

      - name: Brain lint (test/brain-lint.test.js, the node twin of brain-lint.sh)
        run: node test/brain-lint.test.js

      - name: Claims format (test/claims.test.js)
        run: node test/claims.test.js

      - name: Journal round trip (test/journal.test.js)
        run: node test/journal.test.js

      - name: Notify (test/notify.test.js)
        run: node test/notify.test.js

      - name: Apply (test/apply.test.js)
        run: node test/apply.test.js

      - name: Hub log
        if: failure() || cancelled()
        shell: powershell
        run: Get-Content "$env:RUNNER_TEMP\bureau\hub.log", "$env:RUNNER_TEMP\bureau\hub.err.log" -ErrorAction SilentlyContinue

  # platform.test.js on the other two OSes, and on Node 18, the oldest the
  # README promises (global fetch, structuredClone).
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: '22'
          - os: ubuntu-latest
            node: '18'
    name: platform (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Platform (test/platform.test.js)
        run: node test/platform.test.js

      - name: Brain lint (test/brain-lint.test.js)
        run: node test/brain-lint.test.js
