# Builds the hub image and pushes it to ghcr.io/mahoudeau/bureau on every
# release tag (v0.2.0 and up). Tags pushed: 0.2.0, 0.2, latest.
name: release image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mahoudeau/bureau
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest comes from flavor latest=auto: semver tags only, never pre-releases.
          # The Dockerfile labels win over what GitHub's repo metadata would set.
          labels: |
            org.opencontainers.image.description=Bureau hub: a self-hosted mission queue and git brain for AI agents
            org.opencontainers.image.licenses=AGPL-3.0
            io.modelcontextprotocol.server.name=io.github.mahoudeau/bureau

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
