# Bureau hub, one service. Put BUREAU_BOSS_TOKEN in a .env file next to this
# one, then: docker compose up -d
# BUREAU_BOSS_TOKEN is the owner's break-glass credential and turns strict
# mode on (see UPGRADING.md). BUREAU_TOKEN, the old shared token, is optional:
# leave it out unless an agent still needs it. The hub refuses to start with
# neither.
# Sign-in (docs/protocol.md, "MCP with sign-in"): BUREAU_PUBLIC_URL, and
# either a pairing with OMAKO (node hub/tools/omako.js pair, inside the
# container) or BUREAU_OIDC_ISSUER with BUREAU_OIDC_CLIENT_ID and _SECRET.
# Optional in the same .env: BUREAU_PORT (host port), BUREAU_OIDC_OWNERS,
# BUREAU_POKES, BUREAU_SWEEP_MS. See hub/.env.example.
# Paths, HOST and PORT are fixed by the image on purpose.
services:
  bureau:
    build: .
    restart: unless-stopped
    ports:
      - "${BUREAU_PORT:-8100}:8100"
    environment:
      BUREAU_TOKEN: ${BUREAU_TOKEN:-}
      BUREAU_BOSS_TOKEN: ${BUREAU_BOSS_TOKEN:-}
      BUREAU_PUBLIC_URL: ${BUREAU_PUBLIC_URL:-}
      BUREAU_OIDC_ISSUER: ${BUREAU_OIDC_ISSUER:-}
      BUREAU_OIDC_CLIENT_ID: ${BUREAU_OIDC_CLIENT_ID:-}
      BUREAU_OIDC_CLIENT_SECRET: ${BUREAU_OIDC_CLIENT_SECRET:-}
      BUREAU_OIDC_OWNERS: ${BUREAU_OIDC_OWNERS:-}
      BUREAU_POKES: ${BUREAU_POKES:-}
      BUREAU_SWEEP_MS: ${BUREAU_SWEEP_MS:-60000}
    volumes:
      - bureau-data:/data
      - bureau-brain:/brain

# Fixed names, so the state does not hang off the folder you cloned into.
volumes:
  bureau-data:
    name: bureau-data
  bureau-brain:
    name: bureau-brain
