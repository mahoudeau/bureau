# Bureau hub, one service: docker compose up -d, then docker compose logs
# bureau for the first-run link. Open it: you're the owner, and the setup
# guide's Sign in with OMAKO connects the rest. No token to make: a hub with
# none makes its own boss token in its data volume (the owner's break-glass
# credential, see UPGRADING.md). A new link: docker compose exec bureau node
# tools/sign-in-link.js.
# On a server, put BUREAU_PUBLIC_URL (its https address) in a .env file next
# to this one. Optional in the same file: BUREAU_BOSS_TOKEN (your own, wins
# over the hub's), BUREAU_TOKEN (the old shared token, only if an agent still
# needs it), BUREAU_PORT (host port; keep 8100 for a hub on your own
# computer), BUREAU_OIDC_OWNERS, another issuer (BUREAU_OIDC_ISSUER with
# BUREAU_OIDC_CLIENT_ID and _SECRET), BUREAU_POKES, BUREAU_SWEEP_MS. See
# hub/.env.example.
# Paths, HOST and PORT are fixed by the image on purpose.
services:
  bureau:
    build: .
    restart: unless-stopped
    ports:
      - "${BUREAU_PORT:-8100}:8100"
    environment:
      BUREAU_TOKEN: ${BUREAU_TOKEN:-}
      BUREAU_BOSS_TOKEN: ${BUREAU_BOSS_TOKEN:-}
      BUREAU_PUBLIC_URL: ${BUREAU_PUBLIC_URL:-}
      BUREAU_OIDC_ISSUER: ${BUREAU_OIDC_ISSUER:-}
      BUREAU_OIDC_CLIENT_ID: ${BUREAU_OIDC_CLIENT_ID:-}
      BUREAU_OIDC_CLIENT_SECRET: ${BUREAU_OIDC_CLIENT_SECRET:-}
      BUREAU_OIDC_OWNERS: ${BUREAU_OIDC_OWNERS:-}
      BUREAU_POKES: ${BUREAU_POKES:-}
      BUREAU_SWEEP_MS: ${BUREAU_SWEEP_MS:-60000}
    volumes:
      - bureau-data:/data
      - bureau-brain:/brain

# Fixed names, so the state does not hang off the folder you cloned into.
volumes:
  bureau-data:
    name: bureau-data
  bureau-brain:
    name: bureau-brain
