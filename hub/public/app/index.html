<title>Bureau</title>
<!-- Before the stylesheets, so the first paint is already in the right theme.
     Keep the key and the names in step with theme.js. -->
<script>
  (function () {
    var attr = { paper: 'light', ink: 'dark' }, saved = null;
    try { saved = localStorage.getItem('bureau_theme'); } catch (e) { /* no storage: follow the system */ }
    if (attr[saved]) document.documentElement.setAttribute('data-theme', attr[saved]);
  })();
</script>
<link rel="icon" href="/app/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/omako-ds/all.css">

<script type="module" src="/app/main.js"></script>
</head>
