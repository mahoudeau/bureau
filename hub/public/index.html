<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau</title>
<style>
  /* Tokens (light + dark) */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --hairline: #e1e0d9; --border: rgba(11,11,11,.10);
    --accent: #2a78d6; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --hairline: #2c2c2a; --border: rgba(255,255,255,.10);
      --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--hairline); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  #conn { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  main { display: grid; grid-template-columns: 260px 1fr 340px; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 4px 0 10px; font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  /* Agents */
  .agent .name { font-weight: 600; }
  .agent .meta { color: var(--ink2); font-size: 12px; margin-top: 2px; }
  /* Sub-agent fleets (t-80, goal: t-60): nested inside the parent's own
     .card.agent, never a separate card/pane. The count badge reuses the
     .badge shell (see t-61 item i3's own approved markup) but carries no
     status dot of its own — a fleet is not a roster agent with a heartbeat
     history. The fold-out rows below go further: plain text at the .evt/
     .logrow scale, muted only, no accent, no badge-pill shape — that
     visual language specifically means "this has its own heartbeat
     history," which is exactly untrue of a sub-agent, so it's withheld by
     construction, not by convention. */
  details.fleet { margin-top: 4px; }
  details.fleet summary { cursor: pointer; font-size: 11px; color: var(--muted); list-style: none; }
  details.fleet summary::-webkit-details-marker { display: none; }
  details.fleet summary::before { content: '▸ '; }
  details.fleet[open] summary::before { content: '▾ '; }
  details.fleet .subagent { padding: 3px 0 3px 14px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--hairline); }
  details.fleet .subagent:last-child { border-bottom: none; }
  /* Projects */
  .proj { display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--hairline);
          font-size: 13px; cursor: pointer; }
  .proj:hover .pname { color: var(--accent); }
  .proj.active .pname { color: var(--accent); font-weight: 700; }
  .proj .pname { font-weight: 600; }
  .proj .pcounts { color: var(--ink2); font-size: 11.5px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .proj .pedit { text-decoration: none; opacity: .5; }
  .proj .pedit:hover { opacity: 1; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 8px;
           border: 1px solid var(--border); border-radius: 999px; color: var(--ink2); }
  .badge .dot { width: 7px; height: 7px; }
  .badge.active .dot { background: var(--good); }
  .badge.idle .dot { background: var(--warning); }
  .badge.offline .dot { background: var(--muted); }
  /* Board */
  #board { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: start; }
  .col h3 { font-size: 12px; color: var(--ink2); margin: 0 0 8px; font-weight: 600; }
  .task { border-left: 3px solid var(--muted); }
  .task.queued { border-left-color: var(--muted); }
  .task.claimed, .task.in_progress { border-left-color: var(--accent); }
  .task.blocked { border-left-color: var(--serious); }
  .task.review { border-left-color: var(--warning); }
  .task.done { border-left-color: var(--good); }
  .task.failed { border-left-color: var(--critical); }
  .task { cursor: pointer; }
  /* Task detail panel */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 10; }
  #overlay.open { display: flex; align-items: center; justify-content: center; }
  #detail { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            width: min(560px, 92vw); max-height: 84vh; overflow-y: auto; padding: 18px 20px; }
  #detail h3 { margin: 0 0 4px; font-size: 15px; }
  #detail .meta { color: var(--ink2); font-size: 12px; margin-bottom: 10px; }
  #detail .body { white-space: pre-wrap; font-size: 13px; margin-bottom: 12px; }
  #detail .logrow { padding: 5px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  #detail .logrow .ts { color: var(--muted); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  #detail .art a { color: var(--accent); }
  #detail .actions { display: flex; gap: 8px; margin-top: 14px; }
  #detail .actions input { flex: 1; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  button.danger { background: var(--critical); }
  .task .t { font-weight: 600; font-size: 13px; }
  .task .meta { font-size: 11.5px; color: var(--ink2); margin-top: 3px; }
  /* Feed */
  #feed { max-height: 78vh; overflow-y: auto; }
  .evt { padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .evt .ts { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .evt b { font-weight: 600; }
  /* Forms */
  form.newtask { display: flex; gap: 8px; margin-bottom: 14px; }
  input, select, button, textarea { font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
  input { flex: 1; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: none; font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🗂️ Bureau</h1>
  <span id="conn"><span class="dot" id="conndot"></span><span id="conntext">connecting…</span></span>
</header>
<main>
  <section>
    <h2>Agents</h2>
    <div id="agents" class="empty">No agents yet.</div>
    <h2 style="margin-top:22px">Projects <a href="#" onclick="addProject();return false" title="new project" style="color:var(--accent);text-decoration:none;font-size:14px">＋</a></h2>
    <div id="projects" class="empty">No projects yet.</div>
    <h2 style="margin-top:22px">Brain · recent commits</h2>
    <div id="brain" class="empty">Nothing written yet.</div>
  </section>
  <section>
    <h2 id="missions-title">Missions</h2>
    <form class="newtask" id="newtask">
      <input id="nt-title" placeholder="New mission for the team…" required>
      <select id="nt-project" style="flex:0 1 130px"></select>
      <select id="nt-prio"><option value="1">P1</option><option value="2">P2</option><option value="3" selected>P3</option></select>
      <button>Add</button>
      <button type="button" onclick="openGoalForm()" title="a goal: destination + bar; the lead decomposes it">🎯 Goal</button>
    </form>
    <div id="board"></div>
  </section>
  <section>
    <h2>Activity</h2>
    <div id="feed"></div>
  </section>
</main>
<div id="overlay"><div id="detail"></div></div>
<script>
// This dashboard is served by your own hub, so localStorage is fine here.
let TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('bureau_token') || '';
if (!TOKEN) TOKEN = prompt('Bureau token:') || '';
localStorage.setItem('bureau_token', TOKEN);
const api = (p, opts={}) => fetch(p, { ...opts, headers: { 'authorization': 'Bearer ' + TOKEN, 'content-type': 'application/json', ...(opts.headers||{}) } }).then(r => { if (r.status === 401) { localStorage.removeItem('bureau_token'); location.reload(); } return r.json(); });

const COLS = [['queued','Queued'],['claimed','Claimed'],['in_progress','In progress'],['blocked','⏸ Blocked'],['review','👀 Review'],['done','✅ Done'],['failed','❌ Failed']];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? Math.floor(s)+'s' : s < 3600 ? Math.floor(s/60)+'m' : s < 86400 ? Math.floor(s/3600)+'h' : Math.floor(s/86400)+'d'; };

let state = { agents: [], tasks: [], log: [], projects: [], knowledge: { recent: [] } };
let projectFilter = null;
const projLabel = id => (state.projects.find(pj => pj.id === id) || {}).label || id;

function agentStatus(a) {
  const mins = (Date.now() - new Date(a.last_seen)) / 60000;
  return mins < 5 ? 'active' : mins < 60 ? 'idle' : 'offline';
}
function render() {
  const ag = document.getElementById('agents');
  ag.className = state.agents.length ? '' : 'empty';
  ag.innerHTML = state.agents.length ? state.agents.map(a => {
    const st = agentStatus(a);
    // Sub-agent fleet (t-80, goal: t-60): live only, per t-61 item i3 — a
    // stale fleet reads as a lie, so it's gated on the SAME `active`
    // status (heartbeat <5min) the roster badge already uses, and
    // disappears entirely the moment the parent goes idle/offline, same
    // refresh cycle, no separate liveness check.
    const fleet = st === 'active' && Array.isArray(a.sub_agents) ? a.sub_agents : [];
    const fleetBadge = fleet.length ? ` <span class="badge fleet">🧵 ${fleet.length}</span>` : '';
    const fleetFoldout = fleet.length
      ? `<details class="fleet"><summary>${fleet.length} sub-agent${fleet.length === 1 ? '' : 's'}</summary>${
          fleet.map(s => `<div class="subagent">${esc(s.label)}${s.activity ? ' · ' + esc(s.activity) : ''}</div>`).join('')
        }</details>`
      : '';
    return `<div class="card agent"><div class="name">${esc(a.name)}
      <span class="badge ${st}"><span class="dot"></span>${st}</span>${fleetBadge}</div>
      <div class="meta">${esc(a.kind)}${a.activity ? ' · ' + esc(a.activity) : ''} · seen ${ago(a.last_seen)} ago${a.note ? ' · ' + esc(a.note) : ''}</div>${fleetFoldout}</div>`;
  }).join('') : 'No agents yet.';

  document.getElementById('missions-title').innerHTML = projectFilter
    ? `Missions · ${esc(projLabel(projectFilter))} <a href="#" onclick="toggleProjectFilter(null);return false" style="color:var(--accent);text-decoration:none">✕</a>`
    : 'Missions';
  const visible = projectFilter ? state.tasks.filter(t => t.project === projectFilter) : state.tasks;
  // Goal legibility: 🎯 on goal cards, plus children progress (missions whose body cites goal: t-N)
  const goalKids = {};
  for (const t of state.tasks) {
    const m = (t.body || '').match(/goal:\s*(t-\d+)/);
    if (m) { const g = goalKids[m[1]] = goalKids[m[1]] || { done: 0, total: 0 }; g.total++; if (t.status === 'done') g.done++; }
  }
  document.getElementById('board').innerHTML = COLS.map(([key, label]) => {
    const ts = visible.filter(t => t.status === key)
      .sort((a,b) => a.priority - b.priority || b.created_at.localeCompare(a.created_at));
    const shown = key === 'done' ? ts.slice(0, 8) : ts;
    return `<div class="col"><h3>${label} · ${ts.length}</h3>` + shown.map(t => {
      const isGoal = /^goal:/i.test(t.title);
      const kids = isGoal ? goalKids[t.id] : null;
      return `<div class="card task ${t.status}" onclick="openTask('${t.id}')"><div class="t">${isGoal ? '🎯 ' : ''}${esc(t.title)}</div>
       <div class="meta">${t.id} · P${t.priority}${t.assignee ? ' · ' + esc(t.assignee) : ''}${t.project ? ' · ' + esc(t.project) : ''}${kids ? ` · ${kids.done}/${kids.total} missions` : ''}${t.reserved_for ? ' · 🔒 ' + esc(t.reserved_for) : ''}${t.status === 'review' ? (t.gate === 'critic' ? ' · 🧪 critic' : ' · 👤 boss') : ''}</div></div>`;
    }).join('') + `</div>`;
  }).join('');

  // Projects pane: registry plus per-project counts; click to filter, click again to clear.
  const byProj = {};
  for (const pj of (state.projects || [])) {
    const id = typeof pj === 'string' ? pj : pj && pj.id; // tolerate a stale server mid-deploy
    if (id) byProj[id] = { queued: 0, active: 0, review: 0, closed: 0 };
  }
  for (const t of state.tasks) {
    // Count into registered projects only: deleted projects keep their closed
    // missions on the board, but never resurrect as pane rows.
    const b = t.project && byProj[t.project];
    if (!b) continue;
    if (t.status === 'queued') b.queued++;
    else if (t.status === 'review') b.review++;
    else if (t.status === 'done' || t.status === 'failed') b.closed++;
    else b.active++;
  }
  if (projectFilter && !byProj[projectFilter]) projectFilter = null;
  const ids = Object.keys(byProj).sort();
  const sel = document.getElementById('nt-project');
  const keep = projectFilter || sel.value;
  sel.innerHTML = ids.map(n => `<option value="${esc(n)}"${n === (keep || 'general') ? ' selected' : ''}>${esc(projLabel(n))}</option>`).join('');
  const pr = document.getElementById('projects');
  pr.className = ids.length ? '' : 'empty';
  pr.innerHTML = ids.length ? ids.map(n => {
    const b = byProj[n];
    const pj = state.projects.find(x => x.id === n) || {};
    return `<div class="proj${projectFilter === n ? ' active' : ''}" onclick="toggleProjectFilter('${esc(n)}')">
      <span class="pname">${esc(projLabel(n))}</span>${pj.entity ? `<span style="color:#888;font-size:11px;margin-left:6px" title="entity (scope wall)">@${esc(pj.entity)}</span>` : ''}
      <a href="#" class="pedit" title="edit label" onclick="event.stopPropagation();editProjectLabel('${esc(n)}');return false">✏️</a>
      <a href="#" class="pedit" title="entity (scope wall; empty clears)" onclick="event.stopPropagation();editProjectEntity('${esc(n)}');return false">🏛</a>
      <a href="#" class="pedit" title="repo (where the code lives; empty clears)" onclick="event.stopPropagation();editProjectRepo('${esc(n)}');return false">📦</a>
      <a href="#" class="pedit" title="capacity (parallel desks)" onclick="event.stopPropagation();editProjectCapacity('${esc(n)}');return false">🪑</a>
      <a href="#" class="pedit" title="delete (needs no open missions)" onclick="event.stopPropagation();deleteProject('${esc(n)}');return false">🗑</a>
      <span class="pcounts">${pj.capacity > 1 ? `🪑${pj.capacity} · ` : ''}${b.queued}q · ${b.active}w · ${b.review}r · ${b.closed}✓</span></div>`;
  }).join('') : 'No projects yet.';

  const br = document.getElementById('brain');
  br.className = state.knowledge.recent.length ? '' : 'empty';
  br.innerHTML = state.knowledge.recent.length ? state.knowledge.recent.slice(0,8).map(c =>
    `<div class="evt"><span class="ts">${esc(c.date.slice(5,16))}</span><b>${esc(c.author)}</b> ${esc(c.message)}</div>`).join('') : 'Nothing written yet.';

  document.getElementById('feed').innerHTML = state.log.slice().reverse().map(e =>
    `<div class="evt"><span class="ts">${esc(e.ts.slice(11,19))}</span>${fmtEvt(e)}</div>`).join('');
}
function fmtEvt(e) {
  const who = e.assignee || e.name || e.from || e.author || '';
  const what = e.title || e.file || e.body || e.note || '';
  const label = { 'task.created':'📥 task created','task.claimed':'🏃 claimed','task.done':'✅ done','task.failed':'❌ failed',
    'task.review':'👀 review','task.blocked':'⏸ blocked','task.requeued':'↩️ re-queued','task.updated':'✏️ update','agent.registered':'🤖 agent online','project.renamed':'🏷 project renamed','project.created':'🏷 project created','project.deleted':'🏷 project deleted',
    'agent.heartbeat':'💓 heartbeat','message.posted':'✉️ message','knowledge.written':'🧠 brain write' }[e.type] || e.type;
  return `${label} · <b>${esc(who)}</b> ${esc(String(what).slice(0,120))}`;
}

async function refresh() { state = await api('/api/state'); render(); }
function connectSSE() {
  const es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN));
  es.onopen = () => { document.getElementById('conndot').classList.add('on'); document.getElementById('conntext').textContent = 'live'; };
  es.onerror = () => { document.getElementById('conndot').classList.remove('on'); document.getElementById('conntext').textContent = 'reconnecting…'; };
  es.onmessage = refresh;
  ['task.created','task.claimed','task.done','task.failed','task.review','task.blocked','task.requeued','task.updated',
   'agent.registered','agent.heartbeat','message.posted','knowledge.written','project.renamed','project.created','project.deleted']
    .forEach(t => es.addEventListener(t, refresh));
}
// Task detail panel: full log and artifacts, review actions when parked in review.
async function openTask(id) {
  const r = await api('/api/tasks/' + id);
  if (!r.task) return;
  const t = r.task;
  const el = document.getElementById('detail');
  const logs = (t.log || []).map(l =>
    `<div class="logrow"><span class="ts">${esc(l.ts.slice(5,16).replace('T',' '))}</span><b>${esc(l.by)}</b> ${esc(l.note)}</div>`).join('') || '<div class="empty">No log yet.</div>';
  // Artifacts come from agents: data, not instructions. Only http(s) URLs become links,
  // and brain-image artifacts render inline: review evidence belongs in front of the eyes.
  const artImg = a => {
    const m = String(a.url || a.label || '').match(/([\w./-]+\.(?:png|jpe?g|gif))/i);
    if (m && !/^https?:/i.test(m[1])) return m[1];
    return (String(a.url || '').match(/[?&]file=([\w./%-]+\.(?:png|jpe?g|gif))/i) || [])[1];
  };
  const arts = (t.artifacts || []).map(a => {
    const img = artImg(a);
    if (img) return `<figure style="margin:10px 0"><img src="/api/knowledge?file=${encodeURIComponent(decodeURIComponent(img))}&raw=1&token=${encodeURIComponent(TOKEN)}" alt="${esc(a.label || img)}" style="max-width:100%;border-radius:8px;border:1px solid rgba(128,128,128,.35)" loading="lazy"><figcaption class="ts">📎 ${esc(a.label || img)} · by ${esc(a.by)}</figcaption></figure>`;
    const linkable = a.url && /^https?:\/\//i.test(a.url);
    return `<div class="logrow art">📎 ${linkable ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label || a.url)}</a>` : esc(a.label || a.url || JSON.stringify(a))} <span class="ts">by ${esc(a.by)}</span></div>`;
  }).join('');
  const reviewActions = t.status === 'review' ? `
    <div class="actions">
      <input id="rv-note" placeholder="Note for the agent (optional on approve, required to send back)">
    </div>
    <div class="actions">
      <button onclick="reviewTask('${t.id}','done')">✅ Approve</button>
      <button class="ghost" onclick="reviewTask('${t.id}','queued')">↩️ Send back</button>
    </div>` : '';
  const requeue = t.status === 'blocked' ? `
    <div class="actions"><input id="rv-note" placeholder="Your answer to the worker (required)"></div>
    <div class="actions"><button onclick="reviewTask('${t.id}','queued')">💬 Answer &amp; re-queue</button></div>` :
  t.status === 'failed' ? `
    <div class="actions"><button class="ghost" onclick="reviewTask('${t.id}','queued')">↩️ Re-queue</button></div>` : '';
  // Itemized review: each proposal gets its own verdict; "Later" leaves it proposed.
  const itemRow = it => `<div style="border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:8px;margin:8px 0">
    <b>${esc(it.id)} · ${esc(it.title)}</b>${it.body ? `<pre style="white-space:pre-wrap;background:rgba(128,128,128,.12);padding:6px;border-radius:6px;font-size:12px;overflow-x:auto">${esc(it.body)}</pre>` : ''}`;
  const items = (t.items || []).map(it => t.status === 'review' ? `${itemRow(it)}
    <label><input type="radio" name="v_${it.id}" value="approved"${it.verdict === 'approved' ? ' checked' : ''}> Accept</label>
    <label style="margin-left:10px"><input type="radio" name="v_${it.id}" value="rejected"${it.verdict === 'rejected' ? ' checked' : ''}> Reject</label>
    <label style="margin-left:10px"><input type="radio" name="v_${it.id}" value=""${it.verdict === 'proposed' ? ' checked' : ''}> Later</label>
    <input id="c_${it.id}" placeholder="Comment (optional)" value="${esc(it.comment || '')}" style="width:100%;box-sizing:border-box;margin-top:6px"></div>`
    : `${itemRow(it)}<span class="ts">${esc(it.verdict)}${it.comment ? ': ' + esc(it.comment) : ''}</span></div>`).join('');
  el.innerHTML = `
    <h3>${esc(t.title)}</h3>
    <div class="meta">${t.id} · ${esc(t.status)} · P${t.priority}${t.assignee ? ' · ' + esc(t.assignee) : ''}${t.project ? ` · ${esc(projLabel(t.project))}` : ''}${t.gate === 'critic' ? ' · 🧪 critic gate' : ''}${t.lease_until ? ' · lease until ' + esc(t.lease_until.slice(11,16)) : ''}</div>
    ${t.body ? `<div class="body">${esc(t.body)}</div>` : ''}
    ${items}
    ${arts}
    <div style="margin-top:8px">${logs}</div>
    ${reviewActions}${requeue}`;
  document.getElementById('overlay').classList.add('open');
}
async function reviewTask(id, status) {
  const note = (document.getElementById('rv-note') || {}).value || '';
  // A note is required to send back from review; re-queue from blocked/failed has no input and needs none.
  if (status === 'queued' && document.getElementById('rv-note') && !note) { alert('Add a note so the agent knows what to change.'); return; }
  // Per-item verdicts ride along ("" = Later, stays proposed)
  const verdicts = [];
  for (const r of document.querySelectorAll('#detail input[type=radio]:checked')) {
    const iid = r.name.slice(2);
    const c = ((document.getElementById('c_' + iid) || {}).value || '').trim();
    if (r.value || c) verdicts.push({ id: iid, ...(r.value ? { verdict: r.value } : {}), ...(c ? { comment: c } : {}) });
  }
  await api('/api/tasks/' + id, { method: 'PATCH', body: JSON.stringify({ agent: 'human', status, note: note || (status === 'done' ? 'approved' : ''), ...(verdicts.length ? { verdicts } : {}) }) });
  document.getElementById('overlay').classList.remove('open');
  refresh();
}
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') e.target.classList.remove('open');
});
function toggleProjectFilter(name) {
  projectFilter = (name && projectFilter !== name) ? name : null;
  // Filtering also selects the quick-add project: new missions land where you are looking.
  if (projectFilter) document.getElementById('nt-project').value = projectFilter;
  render();
}
async function addProject() {
  const label = (prompt('New project name:') || '').trim();
  if (!label) return;
  const r = await api('/api/projects', { method: 'POST', body: JSON.stringify({ label }) });
  if (r.error) { alert(r.error); return; }
  projectFilter = r.project.id;
  refresh();
}
async function deleteProject(id) {
  if (!confirm(`Delete project "${projLabel(id)}"? Closed missions keep their history; the brain is untouched.`)) return;
  const r = await api('/api/projects/' + id, { method: 'DELETE' });
  if (r.error) { alert(r.error); return; }
  if (projectFilter === id) projectFilter = null;
  refresh();
}
async function editProjectEntity(id) {
  const cur = (state.projects.find(x => x.id === id) || {}).entity || '';
  const entity = prompt(`Entity for "${projLabel(id)}" (scope wall; empty clears):`, cur);
  if (entity === null || entity.trim() === cur) return;
  const r = await api('/api/projects/' + id, { method: 'PATCH', body: JSON.stringify({ entity: entity.trim() }) });
  if (r.error) { alert(r.error); return; }
  refresh();
}
async function editProjectRepo(id) {
  const cur = (state.projects.find(x => x.id === id) || {}).repo || '';
  const repo = prompt(`Repo for "${projLabel(id)}" (https clone URL; empty clears):`, cur);
  if (repo === null || repo.trim() === cur) return;
  const r = await api('/api/projects/' + id, { method: 'PATCH', body: JSON.stringify({ repo: repo.trim() }) });
  if (r.error) { alert(r.error); return; }
  refresh();
}
async function editProjectCapacity(id) {
  const cur = (state.projects.find(x => x.id === id) || {}).capacity || 1;
  const capacity = prompt(`Capacity for "${projLabel(id)}" (parallel desks, 1-9):`, cur);
  if (capacity === null || +capacity === cur) return;
  const r = await api('/api/projects/' + id, { method: 'PATCH', body: JSON.stringify({ capacity: +capacity }) });
  if (r.error) { alert(r.error); return; }
  refresh();
}
async function editProjectLabel(id) {
  const label = (prompt(`New label for "${projLabel(id)}":`, projLabel(id)) || '').trim();
  if (!label || label === projLabel(id)) return;
  const r = await api('/api/projects/' + id, { method: 'PATCH', body: JSON.stringify({ label }) });
  if (r.error) { alert(r.error); return; }
  document.getElementById('overlay').classList.remove('open');
  refresh();
}

// The goal form: destination + bar + reference files, filed as a `goal:` mission
// the lead decomposes. Files ride the attachments API into projects/<p>/references/.
function openGoalForm() {
  const opts = document.getElementById('nt-project').innerHTML;
  document.getElementById('detail').innerHTML = `
    <h3>🎯 New goal</h3>
    <div class="meta">The lead (ummon) decomposes this into missions with acceptance bars. Concrete references beat adjectives.</div>
    <div class="actions" style="margin-top:10px"><input id="g-title" placeholder="Destination, one line (goal: is added for you)" style="flex:1"></div>
    <div class="actions"><select id="g-project" style="flex:1">${opts}</select>
      <select id="g-prio"><option value="1">P1</option><option value="2" selected>P2</option><option value="3">P3</option></select>
      <input id="g-loops" type="number" min="1" max="999" placeholder="Loops (blank = until you stop)" title="Round budget per mission: at round N the critic escalates best-so-far to you" style="flex:0 1 210px"></div>
    <textarea id="g-dest" placeholder="What does done look like? A stranger should be able to tell." style="width:100%;min-height:80px;box-sizing:border-box;margin-top:8px"></textarea>
    <textarea id="g-bar" placeholder="The bar, one reference or criterion per line: URLs, brain paths, hard rules." style="width:100%;min-height:80px;box-sizing:border-box;margin-top:8px"></textarea>
    <div class="actions" style="margin-top:8px"><input type="file" id="g-files" multiple accept=".png,.jpg,.jpeg,.gif,.svg,.pdf"></div>
    <div class="meta">Files up to 5MB upload into the project's references/. Bigger files: drop them over SFTP into the brain under projects/&lt;project&gt;/references/ and list the path in the bar; the hub sweeps hand-dropped files into git within minutes.</div>
    <div class="meta" id="g-status"></div>
    <div class="actions"><button onclick="submitGoal()">File the goal</button></div>`;
  document.getElementById('overlay').classList.add('open');
}
async function submitGoal() {
  const title = document.getElementById('g-title').value.trim();
  const project = document.getElementById('g-project').value;
  const dest = document.getElementById('g-dest').value.trim();
  const bar = document.getElementById('g-bar').value.trim();
  const status = document.getElementById('g-status');
  if (!title || !dest) { status.textContent = 'A goal needs a title and a destination.'; return; }
  const files = Array.from((document.getElementById('g-files') || {}).files || []);
  const uploaded = [];
  for (const f of files) {
    if (f.size > 5 * 1024 * 1024) { status.textContent = `${f.name} is over the 5MB API cap: drop it over SFTP instead.`; return; }
    status.textContent = `Uploading ${f.name}…`;
    const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
    const path = `projects/${project}/references/${f.name.replace(/[^\w.\- ]+/g, '_')}`;
    const w = await api('/api/knowledge', { method: 'POST', body: JSON.stringify({ file: path, content: b64, encoding: 'base64', author: 'human', message: `${project}: goal reference ${f.name}` }) });
    if (w.error) { status.textContent = `Upload failed for ${f.name}: ${w.error}`; return; }
    uploaded.push(path);
  }
  const barLines = [...bar.split('\n').map(s => s.trim()).filter(Boolean), ...uploaded.map(p => `${p} (in the brain)`)];
  const loops = +(document.getElementById('g-loops') || {}).value || 0;
  const body = `${dest}${barLines.length ? `\n\n## Bar\n${barLines.map(l => `- ${l}`).join('\n')}` : ''}${loops ? `\n\n## Loops: ${loops}` : ''}`;
  const r = await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: `goal: ${title.replace(/^goal:\s*/i, '')}`, body, project, priority: +document.getElementById('g-prio').value, created_by: 'human' }) });
  if (r.error) { status.textContent = r.error; return; }
  document.getElementById('overlay').classList.remove('open');
  refresh();
}

document.getElementById('newtask').addEventListener('submit', async e => {
  e.preventDefault();
  const title = document.getElementById('nt-title').value.trim();
  if (!title) return;
  const project = document.getElementById('nt-project').value || 'general';
  await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title, project, priority: +document.getElementById('nt-prio').value, created_by: 'human' }) });
  document.getElementById('nt-title').value = '';
  refresh();
});
refresh(); connectSSE(); setInterval(refresh, 60000);
