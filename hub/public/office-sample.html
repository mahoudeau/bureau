<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau · office sample scene</title>
<style>
  :root { --ink:#e9e4da; --muted:#9b9186; --panel:#15100f; --panel2:#1d1614; --hairline:#332723; --accent:#e0a94a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0807; color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
  header b { color: var(--accent); letter-spacing: .5px; }
  header .sep { color: var(--muted); }
  header .r { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  main { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #stage-wrap { border: 1px solid var(--hairline); background: #000; line-height: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .controls button { font: 12px/1 system-ui, sans-serif; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--hairline);
                      background: var(--panel2); color: var(--ink); cursor: pointer; font-weight: 700; }
  .controls button.on { background: var(--accent); color: #1a1206; border-color: var(--accent); }
  .controls .hint { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
  details { width: 900px; max-width: 94vw; background: var(--panel2); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 12.5px; }
  details .body { font-size: 12px; line-height: 1.6; color: #cfc7ba; margin-top: 8px; }
  details .body b { color: var(--ink); }
  details .body p { margin: 0 0 8px; }
  details .body code { background: #0f0b0a; border: 1px solid var(--hairline); padding: 1px 5px; border-radius: 4px; color: #ffd9a0; }
  details .body ul { margin: 4px 0 10px 18px; padding: 0; }
  details .body li { margin: 3px 0; }
</style>
</head>
<body>
<header>
  <b>BUREAU</b><span class="sep">·</span>office · sample scene (t-59)<span class="r">rectifier round · corner rebuilt entirely from v2 reference sheets · static, no live events</span>
</header>
<main>
  <div id="stage-wrap"><canvas id="stage" width="240" height="160" style="width:960px;height:640px"></canvas></div>
  <div class="controls">
    <button id="btn-idle" class="on">Idle</button>
    <button id="btn-typing">Typing</button>
    <span class="hint">idle = the "idle" heartbeat verb · typing = the "editing" verb (docs/protocol.md)</span>
  </div>
  <details open>
    <summary>About this sample — round 23: rebuilt through the rectifier (the beads-system foundation)</summary>
    <div class="body" id="about"></div>
  </details>
</main>

<script>
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const atlasImg = new Image();
let FRAMES = null;
let atlasReady = false;

let state = 'idle';
let frameIdx = 0;
let lastSwap = 0;

// One-desk corner: wall band top, floor band bottom, window + the
// character's own integrated desk against the wall, a second dressed
// desk (sourced separately per the mission's re-scope) off to the side.
// This function is the only place SCREEN POSITIONS are decided — no
// pixel inside any sprite was redrawn or invented; every sprite here
// came out of hub/tools/rectify.py against a cited region of an owned
// reference sheet (see frames.json's sourceSheets for exact citations).
const FLOOR_Y = 70;

function layout() {
  return {
    wallTileSize: { w: 52, h: 45 },
    floorTileSize: { w: 55, h: 45 },
    window: { x: 18, y: 20 },
    deskTidy: { x: 186, y: FLOOR_Y + 30 },
    character: { x: 84, y: FLOOR_Y - 45 },
  };
}

function drawSprite(name, dx, dy) {
  const s = FRAMES.sprites[name];
  ctx.drawImage(atlasImg, s.x, s.y, s.w, s.h, dx, dy, s.w, s.h);
}

function tileRow(name, y, totalW) {
  const s = FRAMES.sprites[name];
  for (let x = 0; x < totalW; x += s.w) drawSprite(name, x, y);
}

function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!atlasReady) return;
  const L = layout();

  // Wall band (tiled to cover the back wall above the floor line).
  for (let y = 0; y < FLOOR_Y; y += L.wallTileSize.h) tileRow('wall-cracked', y, cv.width);
  // Floor band (tiled below the floor line).
  for (let y = FLOOR_Y; y < cv.height; y += L.floorTileSize.h) tileRow('floor-wood', y, cv.width);

  // Window, set into the wall.
  drawSprite('window-blue-night', L.window.x, L.window.y);

  // Second dressed desk (sheet-desks-workstations-v2, folder built in).
  drawSprite('desk-tidy', L.deskTidy.x, L.deskTidy.y);

  // The character, at its own integrated desk (typing) or standing (idle).
  const st = FRAMES.states[state];
  const name = st.frames[frameIdx % st.frames.length];
  drawSprite(name, L.character.x, L.character.y);
}

function tick(ts) {
  if (atlasReady) {
    const st = FRAMES.states[state];
    if (ts - lastSwap >= st.durationMs) {
      frameIdx = (frameIdx + 1) % st.frames.length;
      lastSwap = ts;
      render();
    }
  }
  requestAnimationFrame(tick);
}

function setState(next) {
  state = next;
  frameIdx = 0;
  lastSwap = 0;
  document.getElementById('btn-idle').classList.toggle('on', state === 'idle');
  document.getElementById('btn-typing').classList.toggle('on', state === 'typing');
  render();
}

document.getElementById('btn-idle').addEventListener('click', () => setState('idle'));
document.getElementById('btn-typing').addEventListener('click', () => setState('typing'));

Promise.all([
  fetch('office-sample-assets/frames.json').then(r => r.json()),
  new Promise((resolve, reject) => {
    atlasImg.onload = resolve;
    atlasImg.onerror = reject;
    atlasImg.src = 'office-sample-assets/atlas.png';
  })
]).then(([frames]) => {
  FRAMES = frames;
  atlasReady = true;
  render();
  requestAnimationFrame(tick);
}).catch(err => {
  document.getElementById('about').innerHTML = '<p style="color:#ff8080">Failed to load atlas/frames — ' + err + '</p>';
});

render();

document.getElementById('about').innerHTML = `
<p><b>Round 23 — the boss's re-scope (2026-08-16T19:10), landed after round 22 was rejected.</b> Direct ruling: before any sample can be the art bar, this mission owns building and implementing the <b>rectifier</b> (the "beads system") as a shared repo tool — <code>hub/tools/rectify.py</code> — then rebuilding this one-desk corner entirely through it from the v2 reference sheets, never by ad-hoc despeckle/quantize again. "If a sprite didn't come out of the rectifier, it doesn't ship."</p>

<p><b>The rectifier, in one line:</b> the generated sheets are a photo OF pixel art; the tool re-derives the true pixels on our own grid — grid-fit (a per-sheet pitch derived from that sheet's own 48px anchor figure, plus a deterministic phase search so cell boundaries land on real edges), per-cell dominant-color vote, a palette shared across every frame of one subject (never per-frame), magenta keyed to alpha, and the grid pitch itself as the only scaling knob (never a post-resize). Full spec: <code>projects/bureau/references/office/PROMPTS.md</code>, "Rectification" section. Full tool source, header-commented: <code>hub/tools/rectify.py</code>.</p>

<p><b>Determinism, checked, not assumed:</b> every manifest under <code>office-sample-assets/rectify-manifests/</code> was run twice against its cited sheet region before shipping; output PNGs were byte-identical both times (sha256 match). The critic can reproduce this: download the cited sheet from the brain, run the matching manifest, diff the sha256 against <code>rectify-report.json</code>'s recorded hash for that region.</p>

<p><b>Per-sprite citations (source sheet, exact region, what changed from round 22):</b></p>
<ul>
<li><b>Character (idle + typing, 5 frames):</b> <code>cast/sheet-agent-undercut-typing.jpg</code> — a NEW sheet this round (round 22 used <code>sheet-agent-anims-a.jpg</code>; the v2 batch's dedicated typing-loop sheet is cleaner and on-model). Row 1 of its 5x2 grid: column 0 is the anchor figure (reused as idle — HONEST FLAG, unchanged from round 21/22: no sheet yet shows a true seated-idle pose, kit prompt 28 is still open), columns 1-4 are the seated typing frames with their own integrated desk/monitor/lamp, one continuous piece of source art.</li>
<li><b>Floor:</b> <code>props/sheet-tiles-surfaces-v2.jpg</code>, row 1 column 1 (wood plank tile), tiled across the floor band.</li>
<li><b>Wall:</b> <code>props/sheet-tiles-surfaces-v2.jpg</code>, row 1 column 4 (cracked plaster), tiled across the wall band — picked over the sheet's warmer wood-tone wall option for the cool 16-bit register the boss's addendum asked for.</li>
<li><b>Window:</b> <code>scenes/scene-window-states.jpg</code>, row 2 column 1, labeled BLUE NIGHT (window + floor light-pool pair) — cool register, consistent with the character's own monitor-lit side.</li>
<li><b>Second desk:</b> <code>props/sheet-desks-workstations-v2.jpg</code>, row 2 column 3 — a plain desk, already dressed with a folder + keyboard in the source art itself.</li>
</ul>

<p><b>Open interpretation, flagged not assumed:</b> the mission text names <code>sheet-desks-workstations-v2</code> as the desk source, but the typing sheet's character is inseparably drawn WITH its own desk/monitor/lamp. Rather than attempt a pixel-level merge of two different sheets' desks under one seated figure (exactly the two-light-sources violation that sent round 20 back), this round sources both: the character keeps its own integrated desk, and a second, separately-extracted desk sits elsewhere in the corner as additional dressed furniture. A future round can revisit this if the boss reads the mission text more literally.</p>

<p><b>Dropped this round:</b> a standalone folder crop from <code>props/sheet-desk-supplies-v2.jpg</code> came back as a near-solid tan block — a bad region fit on my part, not a rectifier bug (the other four crops from four other sheets came out clean). Dropped rather than shipped broken; the second desk's own built-in folder covers the "dressed desk" ask on its own. Flagged for a future round rather than silently reattempted under time pressure.</p>

<p><b>Composition, not redraw:</b> wall and floor bands are tiled repeats of one rectified swatch each (a real render-time tiling loop, see <code>tileRow()</code> in this page's own script — not a wider crop). Window, second desk, and character sit at fixed screen coordinates decided in <code>layout()</code>. No pixel inside any sprite was invented; only where each sprite sits on screen is original composition.</p>

<p><b>Light register, self-assessed:</b> character keeps its established warm-lamp/cool-monitor register (same sheet, same row as idle — no seam by construction). Window is cool BLUE NIGHT. Wall is cool cracked plaster. Floor is warm wood (the one deliberately warm element, grounding the room the way a lamp-lit floor reads in the actual reference mood boards). Second desk carries no strong baked-in light source of its own, so it composites into either register without a visible clash. Read as one coherent cool-night-with-warm-accent scene at native resolution and at the page's display scale; not fresh-eyes critic-verified yet — that verification is the next step, not self-declared here.</p>

<p><b>Mechanical floors, self-checked:</b></p>
<ul>
<li>Every shipped sprite came out of <code>hub/tools/rectify.py</code>, none hand-despeckled/quantized: confirmed by construction (no other image-editing step touches <code>atlas.png</code> after the tool writes each region's PNG and this round's packer concatenates them).</li>
<li>Determinism: same manifest run twice, byte-identical output (sha256-checked, see above) — the critic re-running a cited manifest and confirming a byte-identical sprite is a mechanical pass, not a matter of taste.</li>
<li>No live route touched: this file and <code>office-sample-assets/</code> remain a standalone path only.</li>
<li>No reference (Sea of Stars) filename or pixel appears anywhere in this page or its assets — only owned boss-generated sheet filenames are cited.</li>
<li>No build step, no external request at runtime: atlas and frame table are same-origin fetches to files committed alongside this page.</li>
</ul>

<p><b>Open, not blocking, carried forward for the critic/boss to weigh:</b> the room is a single corner (wall + floor bands, one window, two desks), not the full "engine room" scale of the approved t-56 floor plan — this mission's own scope is a sample, not the full build. Character-height-vs-native-anchor proportion question from round 20/21 remains unresolved in the same way (the sheets are AI-rendered photos of pixel art, not natively low-res the way Sea of Stars crops are) — carried forward, not re-litigated.</p>

<p><b>Delivery:</b> pushed as a new commit on the existing branch <code>t-59-office-sample-scene</code> (PR #12), rebased onto current main first (the branch predated t-92/t-93's v2 chrome convergence work; rebase picked that up cleanly, no manual conflict resolution needed) so this round's diff stays scoped to the office-sample files only.</p>
`;
</script>
</body>
</html>
