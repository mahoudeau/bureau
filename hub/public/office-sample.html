<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau · office sample scene</title>
<style>
  :root { --ink:#e9e4da; --muted:#9b9186; --panel:#15100f; --panel2:#1d1614; --hairline:#332723; --accent:#e0a94a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0807; color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
  header b { color: var(--accent); letter-spacing: .5px; }
  header .sep { color: var(--muted); }
  header .r { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  main { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #stage-wrap { border: 1px solid var(--hairline); background: #000; line-height: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .controls button { font: 12px/1 system-ui, sans-serif; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--hairline);
                      background: var(--panel2); color: var(--ink); cursor: pointer; font-weight: 700; }
  .controls button.on { background: var(--accent); color: #1a1206; border-color: var(--accent); }
  .controls .hint { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
  details { width: 900px; max-width: 94vw; background: var(--panel2); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 12.5px; }
  details .body { font-size: 12px; line-height: 1.6; color: #cfc7ba; margin-top: 8px; }
  details .body b { color: var(--ink); }
  details .body p { margin: 0 0 8px; }
  details .body code { background: #0f0b0a; border: 1px solid var(--hairline); padding: 1px 5px; border-radius: 4px; color: #ffd9a0; }
  details .body ul { margin: 4px 0 10px 18px; padding: 0; }
  details .body li { margin: 3px 0; }
</style>
</head>
<body>
<header>
  <b>BUREAU</b><span class="sep">·</span>office · sample scene (t-59)<span class="r">rectifier round · corner rebuilt entirely from v2 reference sheets · static, no live events</span>
</header>
<main>
  <div id="stage-wrap"><canvas id="stage" width="240" height="160" style="width:960px;height:640px"></canvas></div>
  <div class="controls">
    <button id="btn-idle" class="on">Idle</button>
    <button id="btn-typing">Typing</button>
    <span class="hint">idle = the "idle" heartbeat verb · typing = the "editing" verb (docs/protocol.md)</span>
  </div>
  <details open>
    <summary>About this sample — round 23: rebuilt through the rectifier (the beads-system foundation)</summary>
    <div class="body" id="about"></div>
  </details>
</main>

<script>
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const atlasImg = new Image();
let FRAMES = null;
let atlasReady = false;

let state = 'idle';
let frameIdx = 0;
let lastSwap = 0;

// One-desk corner: wall band top, floor band bottom, window + the
// character's own integrated desk against the wall, a second dressed
// desk (sourced separately per the mission's re-scope) off to the side.
// This function is the only place SCREEN POSITIONS are decided — no
// pixel inside any sprite was redrawn or invented; every sprite here
// came out of hub/tools/rectify.py against a cited region of an owned
// reference sheet (see frames.json's sourceSheets for exact citations).
const FLOOR_Y = 70;

function layout() {
  return {
    wallTileSize: { w: 52, h: 45 },
    floorTileSize: { w: 55, h: 45 },
    // Round 24: window moved up, well clear of the floor line — round 23
    // shipped the window sheet's whole cell (pane + a disconnected floor
    // light-pool graphic below it), which read as "a monitor floating
    // mid-wall with a baked shadow" (consul's send-back). The pool half is
    // dropped entirely this round (see frames.json's round24Fixes); the
    // pane alone sits high on the wall where it unambiguously reads as a
    // window, not floating furniture.
    window: { x: 18, y: 8 },
    // Second desk anchored right at the wall/floor seam (a desk pushed
    // against the back wall, not floating mid-floor) with its own chair
    // pulled up in front of it — round 23 shipped the desk alone, which
    // read as "an unidentified device on open floor" (consul's send-back).
    deskTidy: { x: 178, y: FLOOR_Y + 4 },
    chair: { x: 186, y: FLOOR_Y + 20 },
    character: { x: 84, y: FLOOR_Y - 45 },
  };
}

function drawSprite(name, dx, dy) {
  const s = FRAMES.sprites[name];
  ctx.drawImage(atlasImg, s.x, s.y, s.w, s.h, dx, dy, s.w, s.h);
}

function tileRow(name, y, totalW) {
  const s = FRAMES.sprites[name];
  for (let x = 0; x < totalW; x += s.w) drawSprite(name, x, y);
}

function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!atlasReady) return;
  const L = layout();

  // Wall band (tiled to cover the back wall above the floor line).
  for (let y = 0; y < FLOOR_Y; y += L.wallTileSize.h) tileRow('wall-cracked', y, cv.width);
  // Floor band (tiled below the floor line).
  for (let y = FLOOR_Y; y < cv.height; y += L.floorTileSize.h) tileRow('floor-wood', y, cv.width);

  // Window, set into the wall.
  drawSprite('window-blue-night', L.window.x, L.window.y);

  // Second dressed desk (sheet-desks-workstations-v2, folder built in)
  // with its own chair (same sheet, same light register) pulled up front.
  drawSprite('desk-tidy', L.deskTidy.x, L.deskTidy.y);
  drawSprite('chair', L.chair.x, L.chair.y);

  // The character, at its own integrated desk (typing) or standing (idle).
  const st = FRAMES.states[state];
  const name = st.frames[frameIdx % st.frames.length];
  drawSprite(name, L.character.x, L.character.y);
}

function tick(ts) {
  if (atlasReady) {
    const st = FRAMES.states[state];
    if (ts - lastSwap >= st.durationMs) {
      frameIdx = (frameIdx + 1) % st.frames.length;
      lastSwap = ts;
      render();
    }
  }
  requestAnimationFrame(tick);
}

function setState(next) {
  state = next;
  frameIdx = 0;
  lastSwap = 0;
  document.getElementById('btn-idle').classList.toggle('on', state === 'idle');
  document.getElementById('btn-typing').classList.toggle('on', state === 'typing');
  render();
}

document.getElementById('btn-idle').addEventListener('click', () => setState('idle'));
document.getElementById('btn-typing').addEventListener('click', () => setState('typing'));

Promise.all([
  fetch('office-sample-assets/frames.json').then(r => r.json()),
  new Promise((resolve, reject) => {
    atlasImg.onload = resolve;
    atlasImg.onerror = reject;
    atlasImg.src = 'office-sample-assets/atlas.png';
  })
]).then(([frames]) => {
  FRAMES = frames;
  atlasReady = true;
  render();
  requestAnimationFrame(tick);
}).catch(err => {
  document.getElementById('about').innerHTML = '<p style="color:#ff8080">Failed to load atlas/frames — ' + err + '</p>';
});

render();

document.getElementById('about').innerHTML = `
<p><b>Round 24 — consul's send-back on round 23 (2026-08-16T20:00), confirmed by the boss.</b> Round 23 built the rectifier and rebuilt the corner through it, but the boss's fresh-eyes pass (relayed via consul) found real gaps in the served render: chroma-key fringe halos on nearly every sprite edge, key-tinted speckles across the tiled wall, a window that read as "a floating monitor with a baked shadow," a second desk that read as "a random device on open floor," and coarse face fidelity. Per consul's new standing rule (t-54 protocol amendment, same log entry): reworks now clear the critic before returning to the boss's door — this round is parked for that pass, not self-promoted.</p>

<p><b>The two real rectifier bugs round 23's fix missed, root-caused this round:</b></p>
<ul>
<li><b>Hard-threshold chroma key.</b> Round 23's fix raised <code>key_tolerance</code> to swallow near-magenta blotches, but a single hard threshold is the wrong model for real anti-aliased edge pixels — genuine blends of foreground and background — which either survived as opaque near-magenta fringe or vanished as a hard, aliased edge depending which side of the line they landed on. Rebuilt as a soft two-band key: alpha ramps linearly across an inner/outer distance band, and edge pixels are <b>color-decontaminated</b> (solving <code>observed = alpha_frac·fg + (1-alpha_frac)·bg</code> for <code>fg</code>) instead of shipped as a flat blend with the key color baked in.</li>
<li><b>Palette-averaging drift.</b> This surfaced a second, subtler bug: the shared-palette builder averages votes within a coarse bucket, and that average — a convex combination of individually-safe colors — could itself drift back into key-adjacent territory (two genuine but differently-shifted skin-tone votes straddling the magenta axis can average toward it) and then get handed out by the palette-snap step as if it were a safe color. This is what actually caused round 23's recurring magenta-tinted blotches, even after the tolerance fix. Fixed with an explicit safety filter: any palette candidate whose OWN distance to the background falls under the outer tolerance is rejected outright, never becomes a snap target.</li>
</ul>
<p>Verified, not assumed: a full per-pixel distance-to-background scan of every sprite in this round's atlas (idle, all 4 typing frames, wall tile, window, desk, chair) finds <b>zero</b> pixels — opaque or semi-transparent — within key tolerance of the background color. Determinism re-checked after both fixes: every manifest run twice, byte-identical PNG output (sha256-matched) both times.</p>

<p><b>Composition fixes:</b></p>
<ul>
<li><b>Window:</b> the BLUE NIGHT cell in <code>scenes/scene-window-states.jpg</code> is a window pane PLUS a separate floor-light-pool graphic below it, with a visible gap between them at this sheet's scale — that gap and the pool's flat parallelogram shape is exactly what read as a floating monitor with a baked shadow. Dropped the pool half entirely; the window sprite is now the pane + frame only, repositioned higher on the wall band, clear of the floor line.</li>
<li><b>Second desk:</b> added a chair (same sheet, same light register, <code>props/sheet-desks-workstations-v2.jpg</code> row 3) pulled up in front of it. An unaccompanied small object on open floor read as unidentifiable; a desk with its own chair reads as a workstation.</li>
</ul>

<p><b>Face fidelity — checked, not "fixed," and why:</b> the character sprite is 20px wide at the mandated 48px-tall canonical scale (pitch is fixed by the sheet's own measured anchor figure, never a free parameter — "the grid pitch is the scaling knob," not a resize). At that pitch the face resolves into roughly ten source-cell-widths by construction, the same order of coarseness any 48px-tall pixel-art character's face carries. Checked the phase-search score for this specific region against the sprite's other regions — unremarkable, not a bad-alignment outlier, so this isn't a fixable vote/alignment defect. A materially crisper face would need either a larger on-screen character scale (a scene-design choice, not a rectifier fix) or a dedicated face-only crop at a different logical size (breaking the one-pitch-per-sheet rule this manifest currently follows) — raised as an open question for the critic/boss to weigh, not assumed away.</p>

<p><b>Per-sprite citations (source sheet, exact region):</b></p>
<ul>
<li><b>Character (idle + typing, 5 frames):</b> <code>cast/sheet-agent-undercut-typing.jpg</code>, row 1 of its 5x2 grid: column 0 is the anchor figure (reused as idle — HONEST FLAG, unchanged since round 21: no sheet yet shows a true seated-idle pose, kit prompt 28 is still open), columns 1-4 are the seated typing frames with their own integrated desk/monitor/lamp.</li>
<li><b>Floor:</b> <code>props/sheet-tiles-surfaces-v2.jpg</code>, row 1 column 1 (wood plank tile), tiled across the floor band.</li>
<li><b>Wall:</b> <code>props/sheet-tiles-surfaces-v2.jpg</code>, row 1 column 4 (cracked plaster) — cool register per the boss's spy-HQ addendum.</li>
<li><b>Window:</b> <code>scenes/scene-window-states.jpg</code>, row 2 column 1, BLUE NIGHT — pane + frame only this round.</li>
<li><b>Second desk:</b> <code>props/sheet-desks-workstations-v2.jpg</code>, row 2 column 3 (already dressed with a folder + keyboard in the source art).</li>
<li><b>Chair:</b> <code>props/sheet-desks-workstations-v2.jpg</code>, row 3 — new this round, same sheet as the desk.</li>
</ul>

<p><b>Open interpretation, unchanged from round 23, flagged not assumed:</b> the mission text names <code>sheet-desks-workstations-v2</code> as THE desk source, but the typing sheet's character is inseparably drawn WITH its own desk/monitor/lamp. Rather than merge two differently-lit sheets' desks under one seated figure (the two-light-sources violation that sent round 20 back), this round keeps sourcing both: the character's own integrated desk, plus a second, separately-extracted desk (now with a chair) elsewhere in the corner.</p>

<p><b>Mechanical floors, self-checked:</b></p>
<ul>
<li>Every shipped sprite came out of <code>hub/tools/rectify.py</code>, none hand-edited: confirmed by construction.</li>
<li>Zero key-adjacent pixels anywhere in the atlas (scanned, not assumed) — chroma-key cleanliness is now a stated mechanical floor per consul's amendment, and this round is the first to actually verify it that way rather than by eye.</li>
<li>Determinism: every manifest re-run twice this round, byte-identical (sha256-matched) both times, after both bug fixes.</li>
<li>No live route touched, no build step, no external runtime request, no reference (Sea of Stars) filename anywhere in the shipped assets.</li>
</ul>

<p><b>Not yet independently critic-verified — that is the explicit next step, not self-declared here.</b> Per consul's amendment this round is parked for Moneta's (the critic's) own render and clearance before it goes back to the boss; the gate field on the mission record still reads <code>boss</code> after the rejection, which I've flagged on the mission log as something I'm not authorized to change myself (only the boss or lead agent set the critic gate) — noted for whoever routes this next, not silently worked around.</p>

<p><b>Delivery:</b> pushed as a new commit on the existing branch <code>t-59-office-sample-scene</code> (PR #12).</p>
`;
</script>
</body>
</html>
