<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau · The Office</title>
<!-- t-278 GB era (boss direction 2026-08-22, doctrine in the brain at
     projects/bureau/references/office/GB-DIRECTION.md): the office renders
     as original-Game-Boy-style 4-shade pixel art on a 384x216 internal
     canvas (a 48x27 grid of 8px tiles, ~2.4x the OG 160x144), upscaled by
     device-pixel-INTEGER "super-pixels" with nearest-neighbor, letterboxed.
     Art lives in office-assets.js as indexed pixel-string maps (shared with
     the /office/assets gallery). Palette (4 presets) and pixel scale
     (auto/x2..x6) are user settings, persisted. The hub wiring and
     choreography from round 1 are unchanged: /api/state seats the roster,
     SSE events queue into per-sprite scenes. -->
<style>
  @font-face { font-family: 'OfficePixel'; src: url('/office/font.ttf') format('truetype'); }
  html, body { margin: 0; height: 100%; background: var(--sh0, #14121f); overflow: hidden;
               font-family: 'OfficePixel', 'Courier New', monospace; }
  /* the HUD and ticker live in bands above and below the canvas, never on it;
     fit() reserves the same heights (HUD_BAND, TICKER_BAND) */
  #stage { position: relative; width: 100vw; height: 100vh; display: flex;
           align-items: center; justify-content: center;
           box-sizing: border-box; padding: 36px 0 60px; }
  #wrap { position: relative; }
  canvas { image-rendering: pixelated; display: block; }
  /* GB dialog register for every HTML overlay: lightest fill, double dark
     border (outer border + inset ring), hard corners, no shadow blur. */
  .bubble {
    position: absolute; box-sizing: border-box; /* left/top clamped in frame() */
    background: var(--sh3, #e8e4c9); color: var(--sh0, #33382b);
    border: 2px solid var(--sh0, #33382b);
    box-shadow: inset 0 0 0 1px var(--sh3), inset 0 0 0 3px var(--sh0);
    padding: 7px 9px; font-size: 8px; line-height: 1.7;
    max-width: 240px; white-space: normal; pointer-events: none;
    transition: opacity .3s; z-index: 3;
  }
  .bubble .who { text-decoration: underline; }
  /* the agent card: same dialog register as the bubbles, but it takes clicks */
  .card {
    position: absolute; box-sizing: border-box; z-index: 5;
    background: var(--sh3, #e8e4c9); color: var(--sh0, #33382b);
    border: 2px solid var(--sh0, #33382b);
    box-shadow: inset 0 0 0 1px var(--sh3), inset 0 0 0 3px var(--sh0);
    padding: 10px 26px 10px 12px; font-size: 8px; line-height: 1.9; width: 220px;
  }
  .card[hidden] { display: none; }
  .card .name { font-size: 10px; }
  .card a { color: inherit; }
  .card a:focus, .card button:focus { outline: 2px solid var(--sh0); outline-offset: 1px; }
  .card button { position: absolute; top: 6px; right: 6px; font: inherit; font-size: 8px;
    background: var(--sh1); color: var(--sh3); border: 2px solid var(--sh0); cursor: pointer; padding: 1px 4px; }
  canvas#c:focus { outline: none; } /* the ring is drawn on the canvas, in pixels */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 14px;
    padding: 10px 46px 10px 14px; color: var(--sh3, #e8e4c9); font-size: 8px;
    align-items: center; z-index: 2; /* right padding clears the fixed minimize icon */
    flex-wrap: wrap; row-gap: 6px;
  }
  @media (max-width: 480px) { #hud { gap: 8px; } #hud .logo { font-size: 12px; } }
  #hud .logo { font-size: 16px; }
  #hud .leg { display: inline-flex; align-items: center; gap: 5px; cursor: default; }
  #hud .leg canvas { image-rendering: pixelated; }
  #hud a { text-decoration: none; }
  #hud button {
    font: inherit; font-size: 8px; padding: 5px 8px; cursor: pointer;
    background: var(--sh1, #6b7353); color: var(--sh3, #e8e4c9);
    border: 2px solid var(--sh0, #33382b);
    box-shadow: inset 0 0 0 1px var(--sh3);
  }
  #hud #conn { margin-left: auto; opacity: .7; }
  #hud #conn.live { opacity: 1; }
  #ticker {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 8px; width: min(92vw, 900px); box-sizing: border-box; /* fit() matches the canvas width */
    background: var(--sh3, #e8e4c9); color: var(--sh0, #33382b);
    border: 3px solid var(--sh0, #33382b);
    box-shadow: inset 0 0 0 2px var(--sh3), inset 0 0 0 4px var(--sh0);
    padding: 12px 14px; font-size: 8px; line-height: 1.6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2;
  }
  #btn-min {
    position: absolute; top: 8px; right: 10px; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 24px; text-decoration: none;
    font-size: 14px; line-height: 1;
    background: var(--sh1, #6b7353); color: var(--sh3, #e8e4c9);
    border: 2px solid var(--sh0, #33382b);
    box-shadow: inset 0 0 0 1px var(--sh3);
  }
  #gate {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--sh0, #14121f); z-index: 10; flex-direction: column; gap: 12px;
    color: var(--sh3, #e8e4c9); font-weight: bold;
  }
  #gate[hidden] { display: none; }
  #gate input { font: inherit; font-size: 12px; padding: 8px; background: var(--sh1, #2b2440);
    border: 2px solid var(--sh0, #000); color: var(--sh3, #fffef2); width: 260px; }
  #gate button { font: inherit; font-size: 11px; padding: 8px 14px; background: var(--sh2, #b5b98a);
    color: var(--sh0, #33382b); border: 2px solid var(--sh0, #33382b); cursor: pointer; }
</style>
</head>
<body>
<style>
  [data-mini] #hud, [data-mini] #ticker, [data-mini] #btn-min { display: none !important; }
  /* mini obeys the same whole-number law as the full office: fit() picks
     the largest integer scale the iframe allows and letterboxes it. A box
     narrower than one art pixel per device pixel shows a centered 1x crop
     instead of a smeared downscale. */
  [data-mini] #stage { padding: 0; overflow: hidden; }
  [data-mini] .bubble { display: none; }
</style>
<div id="stage"><div id="wrap"><canvas id="c" tabindex="0" aria-label="The office. Tab moves between desks, the board, the brain shelf and the boss door; Enter opens."></canvas><div class="card" id="card" role="dialog" hidden></div></div></div>
<span class="sr" id="sr" aria-live="polite"></span>
<div id="hud">
  <span class="logo">BUREAU</span>
  <!-- legend: a tiny office sprite plus a number; the words live in the
       title and aria-label, filled in by setLegend() -->
  <span class="leg" id="leg-active" data-icon="monitor-on"><canvas></canvas><span class="n">0</span></span>
  <span class="leg" id="leg-queued" data-icon="folder-queued"><canvas></canvas><span class="n">0</span></span>
  <span class="leg" id="leg-working" data-icon="folder-working"><canvas></canvas><span class="n">0</span></span>
  <span class="leg" id="leg-review" data-icon="folder-review"><canvas></canvas><span class="n">0</span></span>
  <span class="leg" id="leg-done" data-icon="folder-done"><canvas></canvas><span class="n">0</span></span>
  <!-- boss order 2026-08-23: no menu nav on the office — the palette and
       scale settings live on the P and S keys (and on /office/assets);
       the only chrome is the minimize icon, fixed top right. The buttons
       stay in the DOM hidden because the settings logic drives them. -->
  <button id="btn-pal" title="Palette" hidden>OLIVE</button>
  <button id="btn-scale" title="Pixel scale" hidden>AUTO</button>
  <span id="conn">connecting</span>
</div>
<a id="btn-min" href="/v2" title="Minimize back to the dashboard" aria-label="Minimize back to the dashboard">&ndash;</a>
<div id="ticker">&gt; Opening the office...</div>
<div id="gate" hidden>
  <div>BUREAU · STAFF ENTRANCE</div>
  <input id="gate-token" type="password" placeholder="access token" autocomplete="off">
  <button id="gate-go">CLOCK IN</button>
</div>
<script src="/office/assets.js"></script>
<script>
'use strict';
(function () {
  var A = window.OfficeAssets;
  var W = 384, H = 216, TILE = 8;
  // t-278: mini mode — embedded in the dashboard's agents rail as a
  // same-origin iframe (shares bureau_token localStorage). Chrome hides,
  // the canvas letterboxes into whatever box the parent gives us; the
  // integer-scaling law holds (a 208px rail at dpr 2 yields a clean 1x
  // device-pixel render).
  var MINI = new URLSearchParams(location.search).has('mini');
  if (MINI) document.documentElement.setAttribute('data-mini', '');
  // ttfText caches glyph runs; anything drawn before the vendored font
  // finished loading is a fallback-font render frozen forever — flush the
  // cache the moment the real font lands (the rAF loop repaints after).
  if (document.fonts && document.fonts.load) {
    document.fonts.load('8px OfficePixel').then(function () { A.clearTtfCache(); }).catch(function () {});
  }
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;

  // ---- test mode: the regression guard (test/office-guard.sh) -------------
  // On with ?test=1 or window.__OFFICE_TEST set before load (an init
  // script sets it in the mini iframe too). Every canvas draw is checked
  // against the 384x216 bounds, tagged with what was being drawn, and
  // window.__officeTest.check() also reads the pixels back to confirm each
  // one is one of the palette's 4 shades. Only the canvas is checked; the
  // HUD, ticker, bubbles and card are DOM.
  var drawTag = '';
  if (new URLSearchParams(location.search).has('test') || window.__OFFICE_TEST) {
    var oob = [], oobSeen = {};
    var rawImage = ctx.drawImage, rawRect = ctx.fillRect;
    var note = function (x, y, w, h) {
      if (x >= 0 && y >= 0 && x + w <= W && y + h <= H) return;
      var k = drawTag + '@' + x + ',' + y + ',' + w + 'x' + h;
      if (oobSeen[k] || oob.length >= 50) return;
      oobSeen[k] = true;
      oob.push({ what: drawTag, x: x, y: y, w: w, h: h });
    };
    ctx.drawImage = function (img) {
      var a = arguments;
      if (a.length === 3) note(a[1], a[2], img.width, img.height);
      else if (a.length === 5) note(a[1], a[2], a[3], a[4]);
      else note(a[5], a[6], a[7], a[8]);
      return rawImage.apply(ctx, a);
    };
    ctx.fillRect = function (x, y, w, h) { note(x, y, w, h); return rawRect.apply(ctx, arguments); };
    window.__officeTest = {
      check: function () {
        var sh = A.PALETTES[palKey].shades.map(function (s) {
          return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
        });
        var d = ctx.getImageData(0, 0, W, H).data, off = 0, where = [];
        for (var i = 0; i < d.length; i += 4) {
          var ok = d[i + 3] === 255 && sh.some(function (c) { return c[0] === d[i] && c[1] === d[i + 1] && c[2] === d[i + 2]; });
          if (ok) continue;
          off++;
          if (where.length < 10) where.push({ x: (i / 4) % W, y: Math.floor(i / 4 / W), rgba: [d[i], d[i + 1], d[i + 2], d[i + 3]] });
        }
        var r = { palette: palKey, outOfBounds: oob.slice(), offPalette: off, offPaletteAt: where };
        oob = []; oobSeen = {};
        return r;
      },
    };
  }
  ctx.imageSmoothingEnabled = false;

  // ---- settings: palette + super-pixel scale (both persisted) ------------
  var PAL_KEY = 'bureau_office_palette', SCALE_KEY = 'bureau_office_scale';
  var palKey = localStorage.getItem(PAL_KEY);
  if (!A.PALETTES[palKey]) palKey = 'olive';
  var SCALES = ['auto', 2, 3, 4, 6];
  var scaleSetting = localStorage.getItem(SCALE_KEY) || 'auto';
  if (SCALES.indexOf(scaleSetting === 'auto' ? 'auto' : +scaleSetting) === -1) scaleSetting = 'auto';
  else if (scaleSetting !== 'auto') scaleSetting = +scaleSetting;

  // Inverted twins for the alarm flash (a true GB trick: flip the palette).
  Object.keys(A.PALETTES).forEach(function (k) {
    if (k.slice(-4) === '-inv') return;
    A.PALETTES[k + '-inv'] = { label: A.PALETTES[k].label + '!', shades: A.PALETTES[k].shades.slice().reverse() };
  });

  var alarmUntil = 0;
  function pal() {
    return (performance.now() < alarmUntil && Math.floor(performance.now() / 200) % 2)
      ? palKey + '-inv' : palKey;
  }
  function shades() { return A.PALETTES[palKey].shades; }
  function applyCssPalette() {
    var sh = shades();
    var root = document.documentElement;
    root.style.setProperty('--sh0', sh[0]);
    root.style.setProperty('--sh1', sh[1]);
    root.style.setProperty('--sh2', sh[2]);
    root.style.setProperty('--sh3', sh[3]);
    document.getElementById('btn-pal').textContent = A.PALETTES[palKey].label;
    if (!MINI) drawLegendIcons();
  }

  // ---- super-pixel integer scaling (device pixels, letterboxed) ----------
  var SCALE = 3;
  var HUD_BAND = 36, TICKER_BAND = 60; // same as the #stage padding
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    if (MINI) {
      // no bands in mini; below 1x we crop at 1x rather than smear
      var m = Math.max(1, Math.floor(Math.min(innerWidth * dpr / W, innerHeight * dpr / H)));
      SCALE = m;
      cv.style.width = (m * W / dpr) + 'px';
      cv.style.height = (m * H / dpr) + 'px';
      return;
    }
    var availH = Math.max(H / dpr, innerHeight - HUD_BAND - TICKER_BAND);
    var fitN = Math.max(1, Math.floor(Math.min(innerWidth * dpr / W, availH * dpr / H)));
    // fixed setting: N super-pixels per art pixel in CSS terms, never past the window
    var n = scaleSetting === 'auto' ? fitN : Math.min(scaleSetting * Math.round(dpr), fitN);
    SCALE = n;
    var cssW = n * W / dpr;
    cv.style.width = cssW + 'px';
    cv.style.height = (n * H / dpr) + 'px';
    document.getElementById('ticker').style.width = Math.min(cssW, innerWidth - 16) + 'px';
    document.getElementById('btn-scale').textContent =
      scaleSetting === 'auto' ? 'AUTO(' + n + ')' : 'X' + scaleSetting + (n < scaleSetting * Math.round(dpr) ? '(' + n + ')' : '');
  }
  fit(); addEventListener('resize', function () { fit(); if (!MINI) drawLegendIcons(); });

  document.getElementById('btn-pal').addEventListener('click', function () {
    var keys = Object.keys(A.PALETTES).filter(function (k) { return k.slice(-4) !== '-inv'; });
    palKey = keys[(keys.indexOf(palKey) + 1) % keys.length];
    try { localStorage.setItem(PAL_KEY, palKey); } catch (e) {}
    applyCssPalette();
  });
  document.getElementById('btn-scale').addEventListener('click', function () {
    var i = SCALES.indexOf(scaleSetting);
    scaleSetting = SCALES[(i + 1) % SCALES.length];
    try { localStorage.setItem(SCALE_KEY, String(scaleSetting)); } catch (e) {}
    fit();
  });
  applyCssPalette();
  // P cycles the palette, S cycles the pixel scale (the buttons are
  // hidden chrome now; the keys are the switchboard).
  document.addEventListener('keydown', function (e) {
    if (e.key === 'p' || e.key === 'P') document.getElementById('btn-pal').click();
    if (e.key === 's' || e.key === 'S') document.getElementById('btn-scale').click();
  });

  // ---- landmarks (re-gridded to the 8px tile grid) -----------------------
  // A spot is where the sprite is drawn from: feet land at y + 16, so
  // nothing may sit below y = 200 or the feet leave the canvas.
  var SPOT = {
    door:    { x: 48,  y: 194 },
    board:   { x: 72,  y: 56 },
    shelf:   { x: 36,  y: 108 },
    coffee:  { x: 28,  y: 194 },
    bossdoor:{ x: 266, y: 176 }, // beside the mat, not on it
    meet:    { x: 336, y: 84 },
  };
  // Aisles for walking: three horizontal lanes (above the desks, between
  // the rows, along the rug) joined by vertical lanes between the desk
  // columns. Walkers leave a spot straight up or down onto the nearest
  // lane, follow the lanes, and come off the same way.
  var LANE = { top: 56, mid: 108, low: 176 };
  var CROSS = [
    { x: 36,  from: LANE.mid, to: LANE.low },  // left of the desks, under the shelf
    { x: 126, from: LANE.top, to: LANE.low },
    { x: 218, from: LANE.top, to: LANE.low },
  ];
  var MEET_GAP_X = 316; // the gap in the conference room wall
  function laneFor(pt) {
    if (pt.y <= 72) return LANE.top;
    if (pt.y <= 124) return LANE.mid;
    return LANE.low;
  }
  function route(from, to) {
    var pts = [];
    function add(x, y) {
      var l = pts.length ? pts[pts.length - 1] : from;
      if (Math.abs(l.x - x) > 0.5 || Math.abs(l.y - y) > 0.5) pts.push({ x: x, y: y });
    }
    function exitPath(pt) { // pt -> a point on a lane, in walking order
      if (pt.x >= 312 && pt.y < 104) return [{ x: MEET_GAP_X, y: pt.y }, { x: MEET_GAP_X, y: LANE.mid }];
      return [{ x: pt.x, y: laneFor(pt) }];
    }
    var out = exitPath(from), back = exitPath(to).reverse();
    var a = out[out.length - 1], b = back[0];
    out.forEach(function (p) { add(p.x, p.y); });
    if (a.y !== b.y) {
      var best = null, cost = Infinity;
      CROSS.forEach(function (c) {
        var lo = Math.min(a.y, b.y), hi = Math.max(a.y, b.y);
        if (c.from > lo || c.to < hi) return;
        var k = Math.abs(a.x - c.x) + Math.abs(c.x - b.x);
        if (k < cost) { cost = k; best = c; }
      });
      if (best) { add(best.x, a.y); add(best.x, b.y); }
    }
    back.forEach(function (p) { add(p.x, p.y); });
    add(to.x, to.y);
    return pts;
  }
  var DESK_SLOTS = [
    { x: 60, y: 88 }, { x: 152, y: 88 }, { x: 244, y: 88 },
    { x: 60, y: 152 }, { x: 152, y: 152 }, { x: 244, y: 152 },
  ];
  function deskSeat(d) { return { x: d.x + 10, y: d.y + 12 }; } // seated south of the wide desk, left half, back to us

  // ---- live state (unchanged wiring from round 1) ------------------------
  var token = null;
  var AGENTS = [];
  var boardCounts = { queued: 0, working: 0, review: 0, done: 0 };
  var reviewCount = 0; // boss-gate reviews: the folder pile on the mat
  var blockedCount = 0; // blocked on the boss's answer: "?" on the waiting bench
  var TASKS = [];
  var bubbles = new Map();

  function isVisitor(a) { return a.kind === 'dummy' || a.kind === 'demo' || a.kind === 'other'; }
  function liveness(a) {
    var mins = (Date.now() - new Date(a.last_seen)) / 60000;
    return mins < 5 ? 'active' : mins < 60 ? 'idle' : 'offline';
  }

  // Desks are sticky: an agent keeps its desk until it goes offline or
  // leaves the roster. Only then is the desk freed, and a newcomer walks
  // in from the door to the free desk. No re-sort ever moves anyone.
  function syncRoster(agents) {
    var team = agents.filter(function (a) { return !isVisitor(a) && liveness(a) !== 'offline'; });
    team.sort(function (a, b) { return new Date(b.last_seen) - new Date(a.last_seen); });
    AGENTS = AGENTS.filter(function (ag) {
      var still = team.find(function (a) { return a.name === ag.name; });
      if (!still) { var b = bubbles.get(ag.name); if (b) { b.el.remove(); bubbles.delete(ag.name); } }
      return !!still;
    });
    team.forEach(function (a) {
      var ag = AGENTS.find(function (x) { return x.name === a.name; });
      if (!ag) {
        var desk = DESK_SLOTS.find(function (d) { return !AGENTS.some(function (x) { return x.desk === d; }); });
        if (!desk) return; // every desk taken: they wait off screen
        ag = {
          name: a.name, kind: a.kind,
          desk: desk, pos: { x: SPOT.door.x, y: SPOT.door.y },
          target: null, walking: false, dir: 'down', carry: null,
          queue: [], busy: false, awayTimer: 0, emote: null, emoteUntil: 0,
        };
        AGENTS.push(ag);
        enqueue(ag, [{ walk: deskSeat(desk) }]);
      }
      ag.state = liveness(a);
      ag.activity = a.activity || '';
    });
    setLegend('leg-active', AGENTS.filter(function (a) { return a.state === 'active'; }).length,
      function (n) { return 'At work: ' + n + (n === 1 ? ' agent' : ' agents'); });
  }

  // "Waiting for you" is the dashboard's "waiting on you" number: reviews
  // behind the boss gate plus blocked missions waiting on the boss's
  // answer. Critic-gate reviews wait on the critic; a block whose last
  // note says "waiting on: t-N" for a still-open mission waits on that
  // mission (same rule as v2/needs-me-now.js).
  function blockedOnMission(t, byId) {
    var log = t.log || [], last = log[log.length - 1];
    var m = last && /waiting on:\s*(t-\d+)/i.exec(last.note || '');
    var ref = m && byId[m[1]];
    return !!ref && ref.status !== 'done' && ref.status !== 'failed' && ref.status !== 'discarded';
  }
  function syncBoard(tasks) {
    TASKS = tasks;
    var byId = {};
    tasks.forEach(function (t) { byId[t.id] = t; });
    var c = { queued: 0, working: 0, review: 0, done: 0 }, boss = 0, blocked = 0;
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      if (t.status === 'queued') c.queued++;
      // approved is back with its holder, to apply: work in progress
      else if (t.status === 'claimed' || t.status === 'in_progress' || t.status === 'approved') c.working++;
      else if (t.status === 'review') { c.review++; if (t.gate !== 'critic') boss++; }
      else if (t.status === 'blocked') { if (!blockedOnMission(t, byId)) blocked++; }
      else if (t.status === 'done') c.done++;
    }
    boardCounts = c; reviewCount = boss; blockedCount = blocked;
    setLegend('leg-queued', c.queued, function (n) { return 'On the board: ' + n; });
    setLegend('leg-working', c.working, function (n) { return 'In progress: ' + n; });
    setLegend('leg-review', boss + blocked, function (n) {
      return 'Waiting for you: ' + n + ' (' + boss + ' to review, ' + blocked + ' to answer)';
    });
    setLegend('leg-done', c.done, function (n) { return 'Shipped: ' + n; });
  }

  function setLegend(id, n, words) {
    var el = document.getElementById(id);
    el.querySelector('.n').textContent = n;
    el.title = words(n);
    el.setAttribute('aria-label', words(n));
  }
  // Legend icons: the office's own sprites on a light tile, at a
  // whole-number device-pixel scale (about 16 CSS px tall).
  function drawLegendIcons() {
    var dpr = window.devicePixelRatio || 1, p = palKey, sh = shades();
    Array.prototype.forEach.call(document.querySelectorAll('#hud .leg'), function (el) {
      var spr = A.sprite(el.getAttribute('data-icon'), p);

      c.style.width = (c.width * m / dpr) + 'px';
      c.style.height = (c.height * m / dpr) + 'px';
    });
  }

  // ---- per-sprite action queues ------------------------------------------
  function enqueue(ag, steps) { ag.queue.push.apply(ag.queue, steps); }
  function stepQueue(ag) {
    if (ag.walking || ag.busy) return;
    var step = ag.queue.shift();
    if (!step) return;
    if (step.walk) { walkTo(ag, step.walk.x, step.walk.y, step.speed); return; }
    if (step.say) { say(ag, step.say, step.ms || 4200); return; }
    if (step.carry !== undefined) { ag.carry = step.carry; return; }
    if (step.emote) { ag.emote = step.emote; ag.emoteUntil = performance.now() + (step.ms || 2500); return; }
    if (step.wait) { ag.busy = true; setTimeout(function () { ag.busy = false; }, step.wait); return; }
  }
  function walkTo(a, tx, ty, speed) {
    a.path = route(a.pos, { x: tx, y: ty });
    a.target = a.path.shift() || null; a.walking = !!a.target; a.speed = speed || 0.05;
  }
  function stepAgents(dt) {
    for (var i = 0; i < AGENTS.length; i++) {
      var a = AGENTS[i];
      stepQueue(a);
      if (a.target) {
        var dx = a.target.x - a.pos.x, dy = a.target.y - a.pos.y;
        var dist = Math.hypot(dx, dy);
        a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        if (dist < 1.5) {
          a.pos = { x: a.target.x, y: a.target.y };
          a.target = (a.path && a.path.shift()) || null; // next waypoint, if any
          if (!a.target) { a.walking = false; a.dir = 'down'; }
        }
        else { a.pos.x += (dx / dist) * a.speed * dt; a.pos.y += (dy / dist) * a.speed * dt; }
        continue;
      }
      if (!a.queue.length && !a.busy) {
        a.awayTimer -= dt;
        if (a.state === 'idle' && a.awayTimer <= 0) {
          a.awayTimer = 45000 + Math.random() * 60000;
          enqueue(a, [{ emote: 'emote-coffee' }, { walk: SPOT.coffee, speed: 0.035 }, { wait: 6000 }, { walk: deskSeat(a.desk) }]);
        }
        if (a.state !== 'idle') a.awayTimer = 20000;
      }
    }
  }

  // ---- bubbles & ticker ---------------------------------------------------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function say(agent, text, ms) {
    // mini: no room for words, a "!" over the head stands in for the bubble
    if (MINI) { agent.emote = 'emote-bang'; agent.emoteUntil = performance.now() + (ms || 4200); return; }
    var b = bubbles.get(agent.name);
    if (!b) {
      var el = document.createElement('div'); el.className = 'bubble';
      document.getElementById('wrap').appendChild(el);
      b = { el: el }; bubbles.set(agent.name, b);
    }
    b.el.innerHTML = '<span class="who">' + person(agent.name) + '</span> ' + text;
    b.el.style.opacity = 1; b.until = performance.now() + (ms || 4200);
  }
  function tick(msg) { document.getElementById('ticker').innerHTML = '&gt; ' + msg; }
  function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  // ---- choreography (unchanged event mapping; GB props) -------------------
  function agentByName(name) { return AGENTS.find(function (a) { return a.name === name; }); }
  // One ticker line per event, in words, shared by the live stream and
  // the boot line (the last log entry); '' for events that should not move
  // the ticker (heartbeats). Sentence case throughout: the pixel font reads
  // lowercase fine and mission titles keep their own casing. A mission is
  // named by its title, or "a mission", never by a bare id.
  function person(name) {
    if (!name) return 'Someone';
    if (name === 'human' || name === 'boss') return 'You';
    return '<b>' + esc(String(name).charAt(0).toUpperCase() + String(name).slice(1)) + '</b>';
  }
  function titled(d, n) { return d.title ? '"' + esc(clip(d.title, n)) + '"' : 'a mission'; }
  function fileName(f) { return String(f || '').split(',')[0].split('/').pop() || 'a note'; }
  function tickFor(type, d) {
    var who = d.assignee || d.by || d.author || d.from || d.name;
    var note = d.note ? ': ' + esc(clip(d.note, 44)) : '';
    switch (type) {
      case 'agent.registered': return person(d.name) + ' clocked in';
      case 'agent.removed': return person(d.name) + ' left the building';
      case 'task.created': return 'New on the board: ' + titled(d, 56);
      case 'task.claimed': return person(who) + ' picked up ' + titled(d, 48);
      case 'task.review': return person(who) + ' left ' + titled(d, 40) + ' at your door';
      case 'task.done': return (who ? person(who) + ' shipped ' : 'Shipped ') + titled(d, 48);
      case 'task.approved': return 'You approved ' + titled(d, 36) + ', back to ' + person(d.assignee) + ' to apply';
      case 'task.applied': return person(d.by || who) + ' applied ' + (d.item ? esc(clip(d.item, 6)) : 'an item') + ' of ' + titled(d, 36);
      case 'task.failed': return titled(d, 48) + ' failed' + note;
      case 'task.requeued': return titled(d, 40) + ' is back on the board' + note;
      case 'task.blocked': return titled(d, 40) + ' is stuck' + note;
      case 'task.updated': return d.note ? person(who) + ' on ' + titled(d, 30) + ': ' + esc(clip(d.note, 50)) : '';
      case 'knowledge.written': return person(d.author) + ' filed ' + esc(clip(fileName(d.file), 40)) + ' in the brain';
      case 'journal.captured': return person(d.author) + ' noted a ' + esc(clip(d.kind, 12)) + ' in the journal';
      case 'message.posted':
        return person(d.from) + ' to ' + (d.to === '*' ? 'everyone' : d.to === 'boss' ? 'you' : person(d.to)) +
          (d.body ? ': ' + esc(clip(d.body, 44)) : '');

    }

  }
  function onEvent(type, d) {
    var who = d.assignee || d.by || d.author || d.from || d.name;
    var ag = who ? agentByName(who) : null;
    var line = tickFor(type, d);
    if (line) tick(line);
    switch (type) {
      case 'agent.registered':
        refreshState();
        break;
      case 'agent.heartbeat':
        if (ag) { ag.state = 'active'; ag.activity = d.activity || ag.activity; }
        break;
      case 'agent.removed':
        refreshState();
        break;
      case 'task.created':
        refreshState();
        break;
      case 'task.claimed':
        if (ag) enqueue(ag, [
          { walk: SPOT.board }, { carry: 'folder-working' },
          { say: 'on it: ' + titled(d, 40), ms: 3000 },
          { walk: deskSeat(ag.desk) }, { carry: null },
        ]);
        refreshState();
        break;
      case 'task.review':
        if (ag) enqueue(ag, [
          { carry: 'folder-review' }, { walk: SPOT.bossdoor },
          { say: titled(d, 40) + ' is ready for you', ms: 3500 },
          { wait: 1200 }, { carry: null }, { walk: deskSeat(ag.desk) },
        ]);
        refreshState();
        break;
      // Approved, back to its holder: the folder walks from the boss's door
      // back to the agent's desk, the claim walk with the door for the board.
      case 'task.approved':
        if (ag) enqueue(ag, [
          { walk: SPOT.bossdoor }, { carry: 'folder-working' },
          { say: 'approved: ' + titled(d, 36), ms: 3000 },
          { walk: deskSeat(ag.desk) }, { carry: null },
        ]);
        refreshState();
        break;
      // Each apply also broadcasts its brain write, which walks the shelf.
      case 'task.applied':
        refreshState();
        break;
      case 'task.done':
        if (ag) enqueue(ag, [
          { carry: 'folder-done' }, { walk: SPOT.board },
          { say: 'shipped ' + titled(d, 40), ms: 3000 },
          { carry: null }, { walk: deskSeat(ag.desk) },
        ]);
        refreshState();
        break;
      case 'task.failed':
        alarmUntil = performance.now() + 2000;
        refreshState();
        break;
      case 'task.requeued':
      case 'task.blocked':
        refreshState();
        break;
      case 'task.updated':
        if (d.note && ag) enqueue(ag, [{ say: esc(clip(d.note, 60)), ms: 4200 }]);
        break;
      case 'knowledge.written':
        if (ag) enqueue(ag, [
          { walk: SPOT.shelf },
          { say: 'filing ' + esc(clip(fileName(d.file), 34)), ms: 3000 },
          { walk: deskSeat(ag.desk) },
        ]);
        break;
      case 'message.posted': {
        var rcpt = agentByName(d.to);
        if (ag) enqueue(ag, [{ emote: 'emote-mail' }]);
        if (ag && rcpt) enqueue(ag, [
          { walk: { x: rcpt.desk.x + 36, y: rcpt.desk.y + 14 } },
          { say: esc(clip(d.body, 60)), ms: 4200 },
          { walk: deskSeat(ag.desk) },
        ]);
        else if (ag) enqueue(ag, [{ say: 'to ' + (d.to === '*' ? 'everyone' : d.to === 'boss' ? 'you' : person(d.to)) + ': ' + esc(clip(d.body, 40)), ms: 4200 }]);
        break;
      }
    }
  }

  // ---- world drawing (GB tiles + sprites; procedural 4-shade fallbacks

    var stacks = [

    // coffee corner + plant (queue #7, hand-drawn; the machine drips)

    A.drawSprite(ctx, 'plant', p, 34, 192);

    // list with the agents, so a seated agent renders BEHIND the desk
    // (head and shoulders above it) and a walker below renders in front.

    // conference room (fallback walls, queue #8)
    A.tileRect(ctx, 'wall-cap', p, 312, 40, 8, 64);
    A.tileRect(ctx, 'wall-cap', p, 312, 96, 72, 8);
    shadeRect(p, 312, 96, 24, 8, 2); // door gap
    A.drawSprite(ctx, 'chair', p, 336, 46); A.drawSprite(ctx, 'chair', p, 352, 46); A.drawSprite(ctx, 'chair', p, 368, 46);
    A.drawSprite(ctx, 'table-meet', p, 334, 56);
    A.drawSprite(ctx, 'chair', p, 336, 82); A.drawSprite(ctx, 'chair', p, 352, 82); A.drawSprite(ctx, 'chair', p, 368, 82);
    A.ttfText(ctx, 'MEET', p, 338, 62, 0, 8);

    // boss office (fallback, queue #9)
    A.tileRect(ctx, 'wall-cap', p, 304, 152, 80, 8);
    A.tileRect(ctx, 'wall-cap', p, 304, 152, 8, 64);
    A.drawSprite(ctx, 'door-boss', p, 300, 176);   // the boss door fills the gap
    A.drawSprite(ctx, 'mat', p, 285, 183);
    A.drawSprite(ctx, 'bench', p, 252, 202);       // the waiting bench
    shadeRect(p, 328, 176, 48, 16, 1);
    shadeRect(p, 330, 178, 44, 10, 2);
    plaque(p, 'BOSS', 344, 152); // sign on the boss office wall
    // review folders wait in a pile on the mat
    for (var k2 = 0; k2 < Math.min(reviewCount, 4); k2++)
      A.drawSprite(ctx, 'folder-review', p, 288 + (k2 % 2), 184 - k2 * 3);
    if (reviewCount > 4) plaque(p, '+' + (reviewCount - 4), 292, 168);
    // missions blocked on the boss's answer wait on the bench, one "?" each
    for (var k3 = 0; k3 < Math.min(blockedCount, 3); k3++)
      A.drawSprite(ctx, 'emote-quest', p, 252 + k3 * 8, 194);
    if (blockedCount > 3) plaque(p, '+' + (blockedCount - 3), 242, 194);

  }

  // Small sign: dark border, light fill, dark pixel text, centered on cx.
  function plaque(p, text, cx, y) {
    var tw = A.textWidth(text);
    var x0 = cx - Math.floor((tw + 5) / 2);
    shadeRect(p, x0, y, tw + 5, 9, 0);
    shadeRect(p, x0 + 1, y + 1, tw + 3, 7, 3);
    A.drawText(ctx, text, p, x0 + 3, y + 2, 0);
  }

  function drawDeskAt(d, t, p) {
    var ag = AGENTS.find(function (a) { return a.desk === d; });
    var on = ag && ag.state !== 'offline';
    A.drawSprite(ctx, 'desk', p, d.x, d.y);
    var mon = !on ? 'monitor-off' : (Math.floor(t / 700) % 3 === 0 ? 'monitor-glow' : 'monitor-on');
    A.drawSprite(ctx, mon, p, d.x + 34, d.y - 12);

    if (ag && ag.state !== 'offline') {

      var nm = ag.name.length > 14 ? ag.name.slice(0, 13) + '…' : ag.name;

  function atSeat(a) {
    var s = deskSeat(a.desk);

  }

  function drawAgent(a, t) {
    if (a.state === 'offline') return;

    var x = a.pos.x | 0, y = a.pos.y | 0;

    // agent picks a random head and torso at seat time; consul's hands,
    // feet and walk frames come from the assembler. Facings are real now:
    // the boss drew front/back/left/right for every part.
    if (!a.cast) {
      var heads = Object.keys(A.DELIVERED_HEADS), bodies = Object.keys(A.DELIVERED_BODIES);
      a.cast = {

        body: bodies[Math.floor(Math.random() * bodies.length)],

    if (a.walking) {

    } else if (atSeat(a)) {

    }
    var frame = a.walking ? (Math.floor(t / 140) % 2) : 0;
    var key = A.assemble(a.cast.head, a.cast.body, facing, frame);

    // above the top of the head, riding the same bob (the assembled parts

    // sits above the head, or above the folder while one is carried.
    var headY = y - 16 + bob + 2 * spriteTopRow(key);

    if (key) {

    }
  }

  // First non-empty row of a 16x16 agent sprite (the top of the head).

    waiting_input: 'Waiting for input', waiting_permission: 'Waiting for permission',
    blocked: 'Blocked', idle: 'Idle',

  function go(href) { location.href = href; }
  function hotspots() {
    var list = [
      { label: 'Mission board: open the mission list', rect: { x: 24, y: 6, w: 80, h: 32 }, act: function () { go('/v2#board'); } },
      { label: 'Brain shelf: open the brain', rect: { x: 8, y: 52, w: 40, h: 52 }, act: function () { go('/v2#brain'); } },
    ];
    DESK_SLOTS.forEach(function (d) {
      var ag = AGENTS.find(function (a) { return a.desk === d; });
      if (!ag) return;
      list.push({ label: 'Desk of ' + ag.name, rect: { x: d.x, y: d.y - 23, w: 56, h: 39 }, agent: ag,

  function inRect(r, x, y) { return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; }

    for (var i = 0; i < people.length; i++) {
      var a = people[i];
      var top = a.pos.y - 16 + 2 * spriteTopRow(a.lastKey);
      if (inRect({ x: a.pos.x - 2, y: top, w: 20, h: a.pos.y + 16 - top }, x, y))

  // the card
  var cardEl = document.getElementById('card'), cardFor = null;
  function currentMission(name) {

    var working = mine.filter(function (t) { return t.status === 'claimed' || t.status === 'in_progress'; });
    if (working.length) return { t: working[working.length - 1], how: 'On' };
    var parked = mine.filter(function (t) { return t.status === 'review'; });
    if (parked.length) return { t: parked[parked.length - 1], how: 'Waiting on review' };
    return null;
  }
  function openCard(ag) {
    cardFor = ag;
    var m = currentMission(ag.name);

    cardEl.innerHTML =
      '<div class="name">' + person(ag.name) + '</div>' +
      '<div>' + esc(act) + (ag.state === 'idle' && ag.activity !== 'idle' ? ' (idle)' : '') + '</div>' +
      '<div>' + (m
        ? esc(m.how) + ': <a href="/v2#mission=' + encodeURIComponent(m.t.id) + '">' + titled(m.t, 60) + '</a>'

  function placeCard() {
    if (!cardFor || cardEl.hidden) return;

    var top = (d.y - 26) * s - ch; // above the nameplate
    if (top < 0) top = (d.y + 30) * s; // or below the chair
    cardEl.style.left = left + 'px';
    cardEl.style.top = Math.max(0, Math.min(r.height - ch, top)) + 'px';
  }
  function closeCard(refocus) {
    if (cardEl.hidden) return;
    cardEl.hidden = true; cardFor = null;
    if (refocus) cv.focus();
  }
  function announce(s) { document.getElementById('sr').textContent = s; }

  // keyboard: Tab walks the hotspots while the canvas has focus, then
  // lets focus leave the canvas as usual; Enter or Space opens; Escape closes
  var focusIdx = -1;
  function drawFocusRing() {
    if (MINI || document.activeElement !== cv || focusIdx < 0) return;
    var h = hotspots()[focusIdx];
    if (!h) return;
    var r = h.rect, p = pal();
    // dark outer ring, light inner ring, one art pixel each
    shadeRect(p, r.x - 2, r.y - 2, r.w + 4, 1, 0); shadeRect(p, r.x - 2, r.y + r.h + 1, r.w + 4, 1, 0);
    shadeRect(p, r.x - 2, r.y - 2, 1, r.h + 4, 0); shadeRect(p, r.x + r.w + 1, r.y - 2, 1, r.h + 4, 0);
    shadeRect(p, r.x - 1, r.y - 1, r.w + 2, 1, 3); shadeRect(p, r.x - 1, r.y + r.h, r.w + 2, 1, 3);
    shadeRect(p, r.x - 1, r.y - 1, 1, r.h + 2, 3); shadeRect(p, r.x + r.w, r.y - 1, 1, r.h + 2, 3);
  }
  function setFocus(i) {
    focusIdx = i;
    var h = hotspots()[i];
    if (h) announce(h.label);
  }
  if (MINI) {
    cv.removeAttribute('tabindex'); // the dashboard card's own link opens the full office
  } else {
    var lastIdx = 0; // Escape from the card lands back on the same hotspot
    cv.addEventListener('focus', function () { if (focusIdx < 0) setFocus(Math.min(lastIdx, hotspots().length - 1)); });
    cv.addEventListener('blur', function () { if (focusIdx >= 0) lastIdx = focusIdx; focusIdx = -1; });
    cv.addEventListener('keydown', function (e) {
      var n = hotspots().length;
      if (e.key === 'Tab') {
        var next = focusIdx + (e.shiftKey ? -1 : 1);
        if (next >= 0 && next < n) { e.preventDefault(); setFocus(next); }
        else { focusIdx = -1; lastIdx = 0; } // let the browser move focus on
      } else if (e.key === 'Enter' || e.key === ' ') {
        var h = hotspots()[focusIdx];
        if (h) { e.preventDefault(); h.act(); }
      }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCard(true); });
    cv.addEventListener('pointermove', function (e) {
      var p = artPoint(e);
      cv.style.cursor = hitAt(p.x, p.y) ? 'pointer' : 'default';
    });
    // click covers mouse and touch taps alike
    cv.addEventListener('click', function (e) {
      var p = artPoint(e), h = hitAt(p.x, p.y);
      if (h) h.act(); else closeCard(false);
    });
    document.addEventListener('click', function (e) {
      if (e.target !== cv && !cardEl.contains(e.target)) closeCard(false);
    });
  }

  // ---- live wiring (unchanged) -------------------------------------------
  function api(path) {
    return fetch(path, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
      if (r.status === 401) { localStorage.removeItem('bureau_token'); location.reload(); throw new Error('401'); }
      return r.json();
    });
  }
  // At most one refresh per 2s, but a call during the quiet window is not
  // dropped: it runs once when the window ends (two events in a row, like
  // a review then a block, both reach the board).
  var refreshTimer = null, refreshPending = false;
  function refreshState() {
    if (refreshTimer) { refreshPending = true; return; }
    refreshTimer = setTimeout(function () {
      refreshTimer = null;
      if (refreshPending) { refreshPending = false; refreshState(); }
    }, 2000);
    api('/api/state').then(function (s) {
      syncRoster(s.agents || []);
      syncBoard(s.tasks || []);
    }).catch(function () {});
  }
  function connectSSE() {
    var es = new EventSource('/api/events?token=' + encodeURIComponent(token));
    var conn = document.getElementById('conn');
    es.onopen = function () { conn.textContent = 'LIVE'; conn.classList.add('live'); };
    es.onerror = function () { conn.textContent = 'STREAM LOST'; conn.classList.remove('live'); };
    ['agent.registered', 'agent.heartbeat', 'agent.removed',
     'task.created', 'task.claimed', 'task.updated', 'task.done', 'task.failed',
     'task.review', 'task.approved', 'task.applied', 'task.blocked', 'task.requeued',
     'message.posted', 'knowledge.written', 'journal.captured'].forEach(function (type) {
      es.addEventListener(type, function (ev) {
        var d = {}; try { d = JSON.parse(ev.data); } catch (e) {}
        try { onEvent(type, d); } catch (e) {}
      });
    });
  }

  function boot() {
    document.getElementById('gate').hidden = true;
    api('/api/state').then(function (s) {
      syncRoster(s.agents || []);
      syncBoard(s.tasks || []);
      for (var i = 0; i < AGENTS.length; i++) {
        AGENTS[i].queue = []; AGENTS[i].pos = deskSeat(AGENTS[i].desk);
      }
      // the newest log entry that reads as words (heartbeats are skipped)
      var log = s.log || [], line = '';
      for (var j = log.length - 1; j >= 0 && !line; j--) line = tickFor(log[j].type, log[j]);
      tick(line || 'The office is open');
      connectSSE();
      setInterval(refreshState, 60000);
    }).catch(function () { tick('Could not reach the hub'); });
  }
  (function gate() {
    token = localStorage.getItem('bureau_token');
    if (token) return boot();
    var g = document.getElementById('gate');
    g.hidden = false;
    document.getElementById('gate-go').addEventListener('click', function () {
      var v = document.getElementById('gate-token').value.trim();
      if (!v) return;
      localStorage.setItem('bureau_token', v);
      token = v; boot();
    });
    document.getElementById('gate-token').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('gate-go').click();
    });
  })();

  // ---- main loop ----------------------------------------------------------
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(50, t - last); last = t;
    stepAgents(dt);
    drawTag = 'world';
    drawWorld(t);
    // painter's algorithm over desks + agents: sort by baseline (bottom
    // edge). Agent baseline = feet (pos.y + 16); desk baseline = its
    // front bottom edge.
    var paint = [];
    DESK_SLOTS.forEach(function (d) {
      paint.push({ y: d.y + 16, draw: function () { drawTag = 'desk ' + d.x + ',' + d.y; drawDeskAt(d, t, pal()); } });
      // chair south of the desk, left half; baseline below the seated
      // agent's feet so the chair back overlaps their legs (sit illusion)
      // the office chair, native 20x16 (between the too-small 16 and the
      // too-big 32), back view wrapping the seated agent's lower body
      paint.push({ y: d.y + 31, draw: function () { drawTag = 'chair ' + d.x + ',' + d.y; A.drawSprite(ctx, 'chair-office', pal(), d.x + 8, d.y + 12); } });
    });
    AGENTS.forEach(function (a) { paint.push({ y: a.pos.y + 16, draw: function () { drawTag = 'agent ' + a.name; drawAgent(a, t); } }); });
    paint.sort(function (a, b) { return a.y - b.y; }).forEach(function (e) { e.draw(); });
    drawTag = 'focus ring';
    drawFocusRing();
    drawTag = 'outside the draw loop';
    // bubble positions in CSS pixels (canvas CSS size / internal size)
    var rect = cv.getBoundingClientRect(), wrap = document.getElementById('wrap');
    wrap.style.width = rect.width + 'px'; wrap.style.height = rect.height + 'px';
    var cssScale = rect.width / W;
    placeCard();
    // Bubbles scale with the canvas in whole steps (8px text at 3x, 16px
    // at 6x), stay under half the canvas wide, and are clamped inside it.
    var k = Math.max(1, Math.round(cssScale / 3));
    bubbles.forEach(function (b, name) {
      var a = agentByName(name);
      if (!a) return;
      if (b.until && t > b.until) { b.el.style.opacity = 0; return; }
      if (b.k !== k || b.w !== rect.width) {
        b.k = k; b.w = rect.width;
        b.el.style.fontSize = (8 * k) + 'px';
        b.el.style.padding = (7 * k) + 'px ' + (9 * k) + 'px';
        b.el.style.maxWidth = Math.min(240 * k, Math.floor(rect.width / 2)) + 'px';
      }
      b.el.style.left = '0px'; // measure at full available width
      var bw = b.el.offsetWidth, bh = b.el.offsetHeight;
      var cx = (a.pos.x + 8) * cssScale;
      // clear the overhead folder too, when one is carried
      var headTop = (a.pos.y - 16 + 2 * spriteTopRow(a.lastKey) - (a.carry ? 9 : 0)) * cssScale;
      var left = Math.max(0, Math.min(rect.width - bw, cx - bw / 2));
      var top = headTop - 4 - bh;
      if (top < 0) top = (a.pos.y + 18) * cssScale; // no room above: below the feet
      top = Math.max(0, Math.min(rect.height - bh, top));
      b.el.style.left = left + 'px';
      b.el.style.top = top + 'px';
    });
  }
  // One draw loop only. The watchdog below may draw a frame by hand when
  // rAF is throttled (the dashboard mini iframe), but it never schedules
  // another rAF, so a hidden tab cannot stack loops.
  function loop(t) { frame(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  setInterval(function () {
    if (document.hidden) return; // nobody is looking; rAF resumes on its own
    if (performance.now() - last > 500) frame(performance.now());
  }, 500);
})();
</script>
</body>
</html>
