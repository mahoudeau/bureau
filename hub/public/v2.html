  ---------------------------------------------------------------------------
  2. window.BureauV2 — the shared bus/state singleton
  ---------------------------------------------------------------------------
  Every module reads from this instead of opening its own SSE connection or
  rolling its own fetch/auth. Set up before any v2/*.js module tag runs.

    BureauV2.state            Current /api/state snapshot (tasks, agents,
                               projects, messages — whatever the hub
                               returns). Re-read this property fresh each
                               time you need it; it is REASSIGNED (not
                               mutated) on every refresh, so do not cache a
                               reference across an `await`.
    BureauV2.token             Getter, current Bearer token string. Use it
                               to build authenticated asset URLs (e.g.
                               brain image src) the same way index.html
                               does today (`&token=...`); never persist it
                               yourself, it already lives in localStorage
                               under 'bureau_token'.
    BureauV2.live               Getter, boolean — true while the SSE stream
                               is open, false while running on the 60s poll
                               fallback. Read it, don't cache it stale.
    BureauV2.api(path, opts)    Authenticated fetch helper. Same
                               Bearer-header + 401 handling as index.html's
                               `api()`. Returns parsed JSON, or null on a
                               401 (which also clears the stored token and
                               reloads the page — the gate reappears).
    BureauV2.refresh()          Force an immediate /api/state re-fetch
                               (normally you don't need this — the SSE
                               handler and the 60s poll both call it for
                               you — but a module that just POSTed a change
                               it wants reflected NOW may call it directly).
    BureauV2.on(type, cb)       Subscribe. cb(detail) fires whenever `type`
                               is emitted on the bus (see below). Returns
                               an unsubscribe function. `type` is either a
                               raw server SSE event name (task.created,
                               task.claimed, task.done, task.failed,
                               task.review, task.blocked, task.requeued,
                               task.updated, agent.registered,
                               agent.heartbeat, message.posted,
                               knowledge.written, project.renamed,
                               project.created, project.deleted — detail is
                               the event payload) or a synthetic v2:-
                               prefixed lifecycle/UI event (below).
    BureauV2.emit(type, detail) Dispatch. Use a `v2:`-prefixed name for
                               cross-module UI events (server event names
                               are reserved for the real SSE feed). This is
                               the ONLY channel modules should use to talk
                               to each other — never reach into another
                               module's DOM or globals.
    BureauV2.bus                 The underlying EventTarget. `.on`/`.emit`
                               are sugar over `bus.addEventListener` /
                               `bus.dispatchEvent(new CustomEvent(...))` —
                               use the raw bus directly if you need
                               `{ once: true }` or capture-phase listening.
    BureauV2.mounts               Plain object of region id → live DOM node
                               (see the table in §1), e.g.
                               `BureauV2.mounts.board`,
                               `BureauV2.mounts.peekPanel`. Read a mount
                               once at module-init time; the nodes
                               themselves are stable (never replaced).

  Synthetic events emitted by this file (v2:-prefixed, always fire, every
  module may rely on them):
    'v2:ready'        detail: undefined — fires once, after the gate has
                       passed and BureauV2 is fully wired (state fetched at
                       least once, SSE/poll running). Modules that need
                       BureauV2.state to be non-null on first paint should
                       wait for this rather than assuming load order.
    'v2:state'         detail: the new snapshot — fires after every
                       refresh (SSE-triggered or the 60s poll).
    'v2:connection'    detail: { live: boolean } — fires on SSE open/error
                       and is also the signal the topbar conn dot listens
                       to; a module never needs to open its own EventSource
                       to know liveness.
    'v2:viewport'      detail: { phone: boolean } — fires once at boot and
                       again on any resize crossing the phone breakpoint.

  Cross-module UI events other modules are expected to emit/listen for
  (documented here since this file owns the mounts they target, even
  though this file does not implement the behavior itself):
    'v2:mission:open'   detail: { id } — board.js / needs-me-now.js /
                         search.js emit this; peek-panel.js listens and
                         opens #v2-peek-panel with that mission (or
                         goal-progress.js opens #v2-goal-progress instead,
                         when the mission title matches /^goal:/i — same
                         event, the listener decides which surface).
    'v2:palette:open'    detail: none — emitted by the topbar search entry,
                         keyboard.js's shortcut handler, and quick-add's
                         "browse templates" affordance; palette.js listens.
    'v2:batch:selection' detail: { ids: string[] } — board.js emits on
                         every selection change; batch-verdicts.js listens
                         to show/hide/populate #v2-batch-bar.
    'v2:brain:open'      detail: { file?: string } — brain-entry button
                         (wired below) and search.js (brain-content hits)
                         emit this; brain-browser.js listens.

  ---------------------------------------------------------------------------
  3. TOKEN GATE (unchanged function, zero prompt() per t-53's mechanical
     floor — the whole tranche bans prompt()/confirm()/alert() dialogs, so
     the gate is an inline form over #v2-gate instead of window.prompt())
  ---------------------------------------------------------------------------
  Same localStorage key as today ('bureau_token') and the same 401-reprompt
  behavior (clear + reload), so a token already stored for the v1 dashboard

  inline form below instead of a JS prompt() dialog.

  ---------------------------------------------------------------------------
  4. SSE PLUMBING
  ---------------------------------------------------------------------------
  Connects to GET /api/events (same endpoint, same query-string token auth
  EventSource requires, same event-type list as index.html today). The 60s
  poll (`setInterval(refresh, 60000)`) is NOT conditional — it is the
  existing always-on backstop, unchanged, and doubles as the "fall back to
  poll on stream drop" behavior the mission asks for: when SSE is down,
  BureauV2.live is false and every state update still arrives, just on the
  slower 60s cadence instead of instantly.

  ---------------------------------------------------------------------------
  5. CLASS-HOOK CONVENTION
  ---------------------------------------------------------------------------
  Every component root/part class is `v2-`-prefixed (v2-board,
  v2-board__column, v2-chip, v2-status-glyph, v2-panel, v2-panel__header,
  ...). Anything color/spacing/type reads a `var(--v2-...)` custom property
  defined in v2/tokens.css, with an inline neutral fallback
  (`var(--v2-space-3, 12px)`) so the shell renders sanely today and Wave 2
  repaints it by only changing v2/tokens.css — no JS or markup edit, ever,
  for a value that is purely visual. Pure structural layout (grid-
  template-areas, position, z-index, overflow) is NOT token-driven — that
  IS the information architecture in §1 and belongs to this file.

  ---------------------------------------------------------------------------
  6. STATIC SERVING
  ---------------------------------------------------------------------------
  hub/server.js served only '/' and '/index.html' before this mission.
  Added: GET /v2 → hub/public/v2.html, and GET /v2/<name>.(css|js) →
  hub/public/v2/<name>.(css|js) (single path segment only, no traversal
  possible — the route regex has no '/' or '.' repeat in it). A missing
  sibling file 404s from that route the same as any other static 404:
  harmless, does not throw, does not affect other <script type=module>
  tags on this page (each loads independently; a load failure surfaces
  only as a browser network-log entry, never a thrown JS exception).

  ---------------------------------------------------------------------------
  7. LIVE-VS-REPO DRIFT CHECK (t-19/t-41/t-52/t-55/t-56/t-58/t-59 pattern)
  ---------------------------------------------------------------------------
  Checked before writing this file: `curl https://bureau.mathieu.dev/` vs
  hub/public/index.html on this clone's main — byte-identical (424 lines
  both sides) as of this mission's build time. No drift found this pass;
  nothing to reconcile. Recheck this diff before trusting index.html as
  the baseline again in a future mission — the drift has recurred before.

<style>
  /*
    Placeholder token set. Every value below is neutral and provisional —
    v2/tokens.css (loaded above, Wave 2) redefines these same custom
    property names with the real PURE LINEAR values; nothing in this file
    or any sibling module needs to change when that happens.
  */
  :root {
    color-scheme: light;
    /* t-87: aliased to v2/tokens.css's real --v2-color- and --v2-space-
       prefixed schema (t-63 structure, t-75 real values) so every name t-64's
       board.js/peek-panel.js and t-65's keyboard.js/palette.js already
       depend on keeps resolving, without editing any of that shipped
       code — see t-87's closing note for the full table. The fallback
       hex after each var() is this placeholder's old hardcoded value,
       kept only as a belt-and-braces default if tokens.css ever fails
       to load; it is never the value actually used today, since
       tokens.css is always linked above this block. */
    --v2-bg: var(--v2-color-bg, #f7f7f6);
    --v2-surface: var(--v2-color-surface, #ffffff);
    --v2-ink: var(--v2-color-text-primary, #0c0c0d);
    --v2-ink-2: var(--v2-color-text-secondary, #55565c);
    --v2-muted: var(--v2-color-text-muted, #8a8b91);
    --v2-hairline: var(--v2-color-border, rgba(12,12,13,.12));
    --v2-border: var(--v2-color-border-strong, rgba(12,12,13,.16));
    --v2-accent: var(--v2-color-accent, #3f6fe0);
    --v2-on-accent: var(--v2-color-text-on-accent, #fff);
    /* Status severity has no 1:1 match: this schema's old 4-tier scale
       (good/warning/serious/critical, a mission-LIFECYCLE severity
       ramp) doesn't share an axis with tokens.css's 5-tier GOAL-HEALTH
       scale (bug/at-risk/on-track/in-progress/done — tokens.css's own
       header comment names this exact mismatch for board.js's mission
       colors too). Mapped by closest register: good->on-track (success
       green), warning->at-risk (caution amber). serious and critical
       both land on the schema's one red (-status-bug) — there is no
       real third/fourth alert hue to draw a distinct "serious" from, so
       the two-orange distinction this placeholder used to draw between
       them collapses to one red rather than this file inventing an
       uncited color-mix blend. Flagged here plainly for whoever gives
       board.js's task-card severity its own dedicated palette one day —
       out of this mission's v2.html-only scope. */
    --v2-good: var(--v2-color-status-on-track, #17845a);
    --v2-warning: var(--v2-color-status-at-risk, #b5790a);
    --v2-serious: var(--v2-color-status-bug, #b5540a);
    --v2-critical: var(--v2-color-status-bug, #c23434);
    --v2-font: var(--v2-font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
    --v2-font-size: var(--v2-font-size-base, 13px); --v2-line: var(--v2-line-height-base, 1.45);
    /* --v2-space-1..5 intentionally NOT redefined here (they were,
       before this fix): tokens.css already defines --v2-space-1..8
       under these exact same names (2/4/6/8/12/16/24/32px) via the
       <link> above this block. This placeholder used to REDEFINE 1..5
       with different numbers (4/8/12/16/24px), silently shadowing
       tokens.css's real scale for every consumer reading --v2-space-1
       through -5 by name — same-specificity tie, later rule in source
       order wins. Removing the shadowing redefinition, not aliasing it,
       is the correct fix: same name already, no indirection needed. */
    --v2-row-h: var(--v2-row-height, 36px); --v2-radius: var(--v2-radius-sm, 6px);
    --v2-rail-w: 240px; --v2-side-w: 320px; --v2-panel-w: 380px;
    --v2-bp-phone: 720px;
  }
  /* t-87: color-scheme is a native CSS property (UA hint for form-control
     theming), not one of the aliased custom properties above — kept as
     its own toggle, unrelated to the token-schema fix. The hardcoded
     --v2-bg/-surface/-ink/... reassignments that used to live in these
     three blocks are gone: every one of those names is now a live alias
     to tokens.css's real --v2-color-* tokens (above), and tokens.css
     already carries its own complete light/dark/[data-theme] handling
     for every one of them — redefining them again here would just
     shadow tokens.css's real dark values with this file's old hardcoded
     ones, defeating the alias. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* t-227: body is a column flexbox (topbar, fixed height, then .v2-shell
     filling the rest) with its own overflow hidden — .v2-shell becomes the
     one scrolling region, bounded to never reach the viewport's true bottom
     edge (see .v2-shell's own padding-bottom below for why). position:fixed
     children (the two floating triggers, the overlay panels, the palette)
     are unaffected — fixed positioning escapes ancestor overflow clipping
     regardless of this change, since nothing here sets a transform/filter
     on html/body that would create a new containing block. */
  body.v2-app {
    margin: 0; background: var(--v2-bg); color: var(--v2-ink);
    font: var(--v2-font-size)/var(--v2-line) var(--v2-font);
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .v2-skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--v2-surface); color: var(--v2-ink); padding: var(--v2-space-2) var(--v2-space-3);
  }
  .v2-skip-link:focus { left: var(--v2-space-2); top: var(--v2-space-2); }

  /* ---- topbar (§1) ---- */
  .v2-topbar {
    display: flex; align-items: center; gap: var(--v2-space-3);
    padding: var(--v2-space-2) var(--v2-space-4);
    border-bottom: 1px solid var(--v2-hairline);
    height: calc(var(--v2-row-h) + var(--v2-space-2));
    flex: none; /* t-227: fixed cross-size in the body flex column, never shrinks to make room for .v2-shell */
  }
  .v2-topbar__brand { font-weight: 600; display: flex; align-items: center; gap: var(--v2-space-2); }
  .v2-topbar__badge {
    font-size: 10px; font-weight: 600; color: var(--v2-muted);
    border: 1px solid var(--v2-hairline); border-radius: var(--v2-radius);
    padding: 1px 5px; margin-left: var(--v2-space-1);
  }
  /* t-93: converging toward the approved t-58 sample's header — a small
     solid brand mark (a monogram square, the sample's own "B" glyph)
     ahead of the wordmark, and a mode-switch (light/dark/system) that
     genuinely did not exist before this round: --v2-color-scheme was
     read by CSS (see the data-theme selectors just above) but nothing
     in this file ever SET the attribute — dark mode was reachable only
     by a manual DOM edit, never a real control. */
  .v2-topbar__mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--v2-accent); color: var(--v2-on-accent, #fff);
    font-size: 12px; font-weight: 700;
  }
  .v2-modeswitch { display: flex; gap: 2px; margin-left: var(--v2-space-2); border: 1px solid var(--v2-hairline); border-radius: var(--v2-radius); padding: 2px; }
  .v2-modeswitch__btn {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 22px;
    border: none; border-radius: calc(var(--v2-radius) - 2px); background: transparent; color: var(--v2-muted); cursor: pointer;
  }
  .v2-modeswitch__btn svg { width: 13px; height: 13px; }
  .v2-modeswitch__btn.v2-on { background: var(--v2-surface); color: var(--v2-ink); box-shadow: 0 0 0 1px var(--v2-hairline); }
  .v2-search-entry {
    flex: 1; min-width: 0; max-width: 420px; display: flex; align-items: center; gap: var(--v2-space-2);
    background: var(--v2-surface); border: 1px solid var(--v2-hairline); border-radius: var(--v2-radius);
    color: var(--v2-muted); font: inherit; padding: 0 var(--v2-space-3); height: var(--v2-row-h); cursor: pointer;
  }
  /* t-93: min-width:0 + ellipsis — the topbar's flex row didn't shrink this
     child below its text's own intrinsic width (flex items default to
     min-width:auto), so adding the mode-switch's extra ~80px this round
     was enough to overflow/wrap the whole header at phone width. Found by
     actually rendering at 390px, not assumed. */
  .v2-search-entry__label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; }
  .v2-search-entry__hint {
    border: 1px solid var(--v2-hairline); border-radius: 4px; padding: 0 5px; font-size: 11px;
  }
  .v2-conn { margin-left: auto; font-size: 12px; color: var(--v2-ink-2); display: flex; align-items: center; gap: 6px; }
  .v2-conn__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--v2-muted); }
  .v2-conn__dot.v2-on { background: var(--v2-good); }

  /* ---- shell grid (§1 IA) ---- */
  /* t-227 (goal: t-53): search.js/awaiting-merge.js each append a global
     position:fixed trigger pinned to the viewport's bottom corners (see
     the t-149 comment further down — same two elements, a different
     defect). t-149 fixed the case where an OPEN overlay panel's own action
     buttons landed underneath them; it did not cover the ordinary case —
     no panel open, just the board or the needs-me-now list with enough
     content (not necessarily scrolled at all — confirmed live at zero
     scroll on both the reference repros AND a stacked-mobile board card
     mid-list, not just the tail) that some card/row's bottom edge lands in
     the last ~50px of the viewport, where the triggers live.

     A first attempt reserved this space with padding-bottom on a bounded,
     internally-scrolling .v2-shell — that closed the two reference repros
     (both happened to be the true tail of their column) but NOT a third
     live case caught before shipping: on the phone breakpoint the columns
     stack into ONE column (main, then rail, then side), and a board card
     in the middle of that stack (not the last thing on the page) still
     rendered under the trigger at zero scroll. padding-bottom only reserves
     room at the very END of the scrollable content; it does nothing for
     content earlier in the stack that happens to fill the FIRST visible
     window down to the container's own bottom edge — which, with the
     container's outer box still sized to the full remaining viewport, is
     the same screen position the trigger already occupies.

     The fix that actually holds for every case: margin-bottom, not
     padding-bottom, on .v2-shell. Margin sits OUTSIDE this flex item's own
     border-box, so the body flex column's layout algorithm subtracts it
     when computing how tall .v2-shell itself is allowed to render — the
     shell's rendered box structurally ends this many px above the
     viewport's true bottom edge, for ANY content amount and at EVERY
     scroll position (including zero scroll and mid-stack content), because
     it shrinks the box itself rather than reserving space inside an
     unshrunk one. */
  .v2-shell {
    display: grid;
    grid-template-columns: var(--v2-rail-w) 1fr var(--v2-side-w);
    grid-template-areas: "rail main side";
    gap: var(--v2-space-4);
    /* t-264: width MUST be explicit. As a flex item with `margin: 0 auto`,
       auto horizontal margins disable the flex line's cross-axis stretch,
       so without a width the shell falls back to shrink-to-fit and the
       whole layout's width follows board CONTENT (reproduced live: 1600px
       full board -> 834px with a filter matching zero missions). 100%
       (capped by max-width, centered by the auto margins) pins the three
       grid tracks to the viewport regardless of what the board holds. */
    width: 100%; max-width: 1600px; margin: 0 auto; padding: var(--v2-space-4);
    align-items: start;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    margin-bottom: calc(var(--v2-space-3) + 44px + var(--v2-space-4));
  }
  .v2-rail { grid-area: rail; display: flex; flex-direction: column; gap: var(--v2-space-4); min-width: 0; }
  .v2-main { grid-area: main; display: flex; flex-direction: column; gap: var(--v2-space-4); min-width: 0; }
  .v2-side { grid-area: side; display: flex; flex-direction: column; gap: var(--v2-space-4); min-width: 0; }

  /* t-93: sidebar nav (Board/Goals/Brain) — the approved t-58 sample's own
     top-of-rail structure, absent entirely before this round (the rail
     held only the agents/projects/brain-entry cards, no top-level nav).
     Board/Goals swap the .v2-main view (see the boot script below);
     Brain reuses the existing #v2-brain-entry overlay-open behavior
     rather than duplicating it — one click target for "open the brain",
     matching how #v2-brain-entry already worked pre-this-round. */
  .v2-navtabs { display: flex; flex-direction: column; gap: 2px; }
  .v2-navitem {
    display: flex; align-items: center; gap: var(--v2-space-2);
    padding: var(--v2-space-2) var(--v2-space-3); border-radius: var(--v2-radius);
    color: var(--v2-ink-2); font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent;
    text-align: left; width: 100%;
    /* t-150 (goal: t-53): min-height 44px, not the .v2-hit44 pseudo-element
       trick. .v2-navtabs stacks these with only a 2px gap, so a centered
       invisible 44px zone on each item (extending ~10.5px above/below its
       ~23px box) would overlap its neighbor's own hit zone by most of the
       row — confirmed by the math before reaching for either tool: two
       items packed this tight would fight over which one a boundary tap
       resolves to (later DOM sibling wins the overlap, so a tap visually
       over "Board" could actually open "Goals"). These are the whole
       app's section switcher, so a mistargeted tap here is worse than the
       modest height growth. align-items:center already keeps the label
       centered in the taller row. */
    min-height: 44px;
  }
  .v2-navitem svg { width: 15px; height: 15px; flex: none; }
  .v2-navitem:hover { background: var(--v2-surface); }
  /* t-265 (boss report): the active state is the filled rounded row ONLY —
     crop-ux-sidebar-item.png's selected item carries a raised fill and
     brighter text, no accent edge; the old inset 2px left bar was an
     invention outside the register. */
  .v2-navitem.v2-on { background: var(--v2-surface); color: var(--v2-ink); font-weight: 600; }

  .v2-region-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--v2-muted);
    font-weight: 600; margin: 0 0 var(--v2-space-2);
  }
  .v2-card {
    background: var(--v2-surface); border: 1px solid var(--v2-hairline); border-radius: var(--v2-radius);
    padding: var(--v2-space-3);
  }
  .v2-empty { color: var(--v2-muted); font-size: 12px; padding: var(--v2-space-2) 0; }

  #v2-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--v2-space-3); align-items: start; }

  /* ---- phone breakpoint (§1) ---- */
  @media (max-width: 720px) {
    .v2-shell {
      grid-template-columns: 1fr;
      grid-template-areas: "main" "rail" "side";
    }
    .v2-main { order: 1; }
    #v2-needs-me-now { order: -1; } /* promoted to the top of .v2-side, but .v2-side itself sorts after .v2-main below */
    .v2-rail { order: 2; }
    .v2-side { order: 3; }
    .v2-panel, .v2-brain-panel, .v2-goal-progress-panel { width: 100%; right: 0; left: 0; top: auto; bottom: 0; height: 80vh; border-radius: var(--v2-radius) var(--v2-radius) 0 0; }
    /* t-93 round 4: the mission-detail panel specifically (not the brain
       browser or goal-progress panels, which this round's own critic
       finding didn't touch) becomes a true full-viewport takeover on
       phone, matching the sample's own phone mockup (t-58-current-phone.png
       — nothing else visible behind it) instead of an 80vh sheet leaving
       the board's tail columns visible underneath. */
    /* width: 100% here is NOT redundant with the shared rule above: this
       file's later, unconditional `.v2-panel, .v2-brain-panel, ...{width:
       var(--v2-panel-w)}` base rule (outside any media query) sits AFTER
       this @media block in source order, and wins the cascade on width at
       EQUAL class-selector specificity regardless of the media query still
       matching — a real pre-existing ordering bug, confirmed live (the
       panel measured 380px, the desktop width, at a 390px viewport before
       this line was added). #v2-peek-panel's ID selector reliably beats
       that later class rule on every property this ruleset sets, so
       repeating width:100% here is the scoped fix rather than reordering
       the whole stylesheet (which would need auditing brain-panel/goal-
       progress-panel too — both still carry the same latent bug, flagged
       here rather than silently worked around only for peek-panel). */
    #v2-peek-panel { top: 0; height: 100dvh; width: 100%; border-radius: 0; }
    /* t-93: the ⌘K hint means nothing without a keyboard, and the
       mode-switch's three buttons are the least essential topbar element
       at this width — drop both so the brand + search label + live dot
       stay legible instead of wrapping onto a second line. */
    .v2-search-entry__hint, .v2-modeswitch { display: none; }
    .v2-topbar { gap: var(--v2-space-2); padding-left: var(--v2-space-3); padding-right: var(--v2-space-3); }
  }

  /* ---- overlays: peek panel / brain panel / goal progress — slide-in, never a modal (§1, §5) ---- */
  .v2-panel, .v2-brain-panel, .v2-goal-progress-panel {
    position: fixed; top: 0; right: 0; height: 100vh; width: var(--v2-panel-w);
    background: var(--v2-surface); border-left: 1px solid var(--v2-hairline);
    box-shadow: -8px 0 24px rgba(0,0,0,.12);
    transform: translateX(100%); transition: transform .18s ease;
    z-index: 40; overflow-y: auto; padding: var(--v2-space-4);
  }
  .v2-panel:not([hidden]), .v2-brain-panel:not([hidden]), .v2-goal-progress-panel:not([hidden]) { transform: translateX(0); }
  #v2-peek-panel { z-index: 42; }
  #v2-brain-panel { z-index: 41; }
  #v2-goal-progress { z-index: 41; }

  /* t-149: search.js and awaiting-merge.js each append a page-global,
     position:fixed trigger button at z-index 44 — two layers above every
     panel above (40-42). At any width where a panel's own action bar lands
     near the viewport bottom (the normal case at the 390px phone
     breakpoint, where #v2-peek-panel is a full-viewport 100dvh takeover —
     see the phone-breakpoint block above), the triggers physically cover
     the panel's buttons and intercept real taps (confirmed via
     elementFromPoint: a tap on #v2-pp-approve/#v2-pp-answer/#v2-pp-sendback
     resolves to .v2-search-trigger__label / .v2-awaitmerge-trigger
     instead). Both trigger buttons are global chrome, not board-scoped, so
     narrowing their own z-index would just move the collision elsewhere;
     the correct fix is to cede the floating-chrome footprint to whichever
     overlay panel is currently open. The panels already expose that state
     via :not([hidden]) (line 496), so this is a pure CSS rule with no JS
     wiring — :has() reads the panels' own hidden attribute from the
     trigger buttons' shared ancestor (both triggers and all three panels
     are appended as direct children of <body>, so `body:has(...)` sees
     every one of them regardless of DOM insertion order). display:none
     both hides the visual overlap and removes the elements from hit-testing,
     which a lower z-index alone would not guarantee against subtree
     pointer-event capture. */
  body:has(.v2-panel:not([hidden]), .v2-brain-panel:not([hidden]), .v2-goal-progress-panel:not([hidden])) .v2-search-trigger,
  body:has(.v2-panel:not([hidden]), .v2-brain-panel:not([hidden]), .v2-goal-progress-panel:not([hidden])) .v2-awaitmerge-trigger {
    display: none;
  }

  /* ---- cmd-K palette: centered overlay, not a <dialog> modal — no backdrop click-trap semantics ---- */
  .v2-palette {
    position: fixed; top: 12vh; left: 50%; transform: translateX(-50%);
    width: min(560px, 92vw); max-height: 60vh; overflow-y: auto;
    background: var(--v2-surface); border: 1px solid var(--v2-border); border-radius: var(--v2-radius);
    box-shadow: 0 12px 40px rgba(0,0,0,.22); z-index: 50; padding: var(--v2-space-2);
  }
  @media (max-width: 720px) { .v2-palette { top: 0; left: 0; transform: none; width: 100%; height: 100%; max-height: 100%; border-radius: 0; } }

  /* ---- batch verdicts bar ---- */
  .v2-batch-bar {
    position: fixed; left: 50%; bottom: var(--v2-space-4); transform: translateX(-50%);
    background: var(--v2-ink); color: var(--v2-bg); border-radius: var(--v2-radius);
    padding: var(--v2-space-2) var(--v2-space-3); display: flex; gap: var(--v2-space-3); align-items: center;
    z-index: 46; font-size: 12px;
  }

  /* ---- toasts: non-blocking, replaces alert()/confirm() everywhere in v2 ---- */
  .v2-toasts { position: fixed; right: var(--v2-space-3); bottom: var(--v2-space-3); z-index: 60; display: flex; flex-direction: column; gap: var(--v2-space-2); }
  .v2-toast {
    background: var(--v2-ink); color: var(--v2-bg); border-radius: var(--v2-radius);
    padding: var(--v2-space-2) var(--v2-space-3); font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }

  /* ---- token gate: inline form, zero prompt() (§3) ---- */
  .v2-gate {
    position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
    background: var(--v2-bg);
  }
  .v2-gate__form {
    display: flex; flex-direction: column; gap: var(--v2-space-2); width: min(320px, 90vw);
    background: var(--v2-surface); border: 1px solid var(--v2-hairline); border-radius: var(--v2-radius);
    padding: var(--v2-space-4);
  }
  .v2-gate__label { font-size: 12px; color: var(--v2-ink-2); }
  .v2-gate__input {
    font: inherit; padding: var(--v2-space-2); border: 1px solid var(--v2-hairline); border-radius: var(--v2-radius);
    background: var(--v2-bg); color: var(--v2-ink);
  }
  .v2-gate__submit {
    font: inherit; font-weight: 600; padding: var(--v2-space-2); border: none; border-radius: var(--v2-radius);
    background: var(--v2-accent); color: var(--v2-on-accent, #fff); cursor: pointer;
  }
  .v2-gate__err { color: var(--v2-critical); font-size: 12px; margin: 0; }

  [hidden] { display: none !important; }
</style>
</head>
<body class="v2-app">
<a class="v2-skip-link" href="#v2-board">Skip to board</a>

<!-- §3 token gate: shown only until a token is present; zero prompt() -->
<div class="v2-gate" id="v2-gate" hidden>

       topbar's own height is hard-pinned to var(--v2-row-h) (34px here),
       so growing this control's real box to 44px would either overflow the
       topbar or force growing every sibling in it (brand mark, mode-switch,

       max(44px,100%) only grows the height, invisibly, without touching

  <button class="v2-search-entry v2-hit44" id="v2-search-entry" type="button" aria-label="Search missions and brain (opens the command palette)">

    <button type="button" class="v2-modeswitch__btn" data-mode="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
    <button type="button" class="v2-modeswitch__btn" data-mode="system" title="System" aria-label="System theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></button>
  </div>

    <nav class="v2-navtabs" id="v2-navtabs" aria-label="Primary view">
      <button type="button" class="v2-navitem v2-on" id="v2-nav-board" data-view="board" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg><span>Board</span></button>
      <button type="button" class="v2-navitem" id="v2-nav-goals" data-view="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg><span>Goals</span></button>
      <button type="button" class="v2-navitem" id="v2-nav-brain" data-view="brain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span>Brain</span></button>
    </nav>
    <section class="v2-card" id="v2-agents-rail" aria-label="Agent roster">

    </button>

  <main class="v2-main" id="v2-main">
    <!-- t-265: the i8 activity-insights strip is BACKLOG, unbuilt by design
         (needs-me-now.js's own header) — its mount used to sit here with a
         permanent "Loading…" placeholder no module ever replaced (the boss's
         report). The section returns WITH the feature; until then a dead
         region promising content is worse than no region. The boot script's
         mounts.insightsStrip lookup and the Goals-view toggle both already
         null-check. -->

    <section id="v2-goals" aria-label="Goals">

      <div id="v2-board"><div class="v2-empty">Loading…</div></div>

  <aside class="v2-side" id="v2-side-rail">

      <div class="v2-empty">Nothing waiting on you.</div>
    </section>
    <section class="v2-card" id="v2-activity-feed" aria-label="Activity">
      <h2 class="v2-region-title">Activity</h2>

<!-- overlays: not part of the grid flow, all hidden by default, all non-modal -->
<aside class="v2-panel" id="v2-peek-panel" hidden aria-label="Mission detail"></aside>
<aside class="v2-brain-panel" id="v2-brain-panel" hidden aria-label="Brain browser"></aside>
<aside class="v2-goal-progress-panel" id="v2-goal-progress" hidden aria-label="Goal progress"></aside>
<div class="v2-palette" id="v2-palette" hidden role="dialog" aria-modal="false" aria-label="Command palette"></div>
<div class="v2-batch-bar" id="v2-batch-bar" hidden aria-label="Batch verdicts"></div>
<div class="v2-toasts" id="v2-toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---- §3 token gate: same localStorage key + 401-reprompt as index.html,
  // zero window.prompt() (t-53 mechanical floor bans prompt()/confirm()/alert()) ----
  let TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('bureau_token') || '';
  const gate = document.getElementById('v2-gate');
  const gateForm = document.getElementById('v2-gate-form');
  const gateInput = document.getElementById('v2-gate-input');
  const gateErr = document.getElementById('v2-gate-err');

  function showGate(err) {
    gate.hidden = false;
    gateErr.hidden = !err;
    gateInput.focus();
  }
  gateForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const v = gateInput.value.trim();
    if (!v) return;
    TOKEN = v;
    localStorage.setItem('bureau_token', TOKEN);
    gate.hidden = true;
    boot();
  });

  // ---- BureauV2 singleton (§2) ----
  const bus = new EventTarget();
  let liveState = null;
  let sseLive = false;
  let phoneMode = window.matchMedia('(max-width: 720px)').matches;

  function on(type, cb) {
    const h = e => cb(e.detail);
    bus.addEventListener(type, h);
    return () => bus.removeEventListener(type, h);
  }
  function emit(type, detail) { bus.dispatchEvent(new CustomEvent(type, { detail })); }

  async function apiCall(p, opts) {
    opts = opts || {};
    const r = await fetch(p, Object.assign({}, opts, {
      headers: Object.assign({ authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' }, opts.headers || {})
    }));
    if (r.status === 401) {
      localStorage.removeItem('bureau_token');
      location.reload();
      return null;
    }
    return r.json();
  }

  async function refresh() {
    const snap = await apiCall('/api/state');
    if (snap) { liveState = snap; emit('v2:state', snap); }
  }

  function setConn(live) {
    sseLive = live;
    const dot = document.getElementById('v2-conn-dot');
    const text = document.getElementById('v2-conn-text');
    if (dot) dot.classList.toggle('v2-on', live);
    if (text) text.textContent = live ? 'live' : 'polling…';
    emit('v2:connection', { live });
  }

  function connectSSE() {
    let es;
    try { es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN)); }
    catch (err) { setConn(false); return; } // constructor throw (e.g. no EventSource) — 60s poll below still covers state
    es.onopen = function () { setConn(true); };
    es.onerror = function () { setConn(false); }; // the 60s poll interval is unconditional, so state still arrives
    [
      'task.created', 'task.claimed', 'task.done', 'task.failed', 'task.review', 'task.blocked', 'task.requeued', 'task.updated',
      'agent.registered', 'agent.heartbeat', 'message.posted', 'knowledge.written', 'project.renamed', 'project.created', 'project.deleted'
    ].forEach(function (type) {
      es.addEventListener(type, function (e) {
        let payload = null;
        try { payload = JSON.parse(e.data); } catch (err) { /* malformed payload: still trigger a refresh below */ }
        emit(type, payload);
        refresh();
      });
    });
  }

  function updateViewport() {
    const next = window.matchMedia('(max-width: 720px)').matches;
    if (next !== phoneMode) { phoneMode = next; emit('v2:viewport', { phone: phoneMode }); }
  }
  window.addEventListener('resize', updateViewport);

  const mounts = {
    topbar: document.getElementById('v2-topbar'),
    searchEntry: document.getElementById('v2-search-entry'),
    agentsRail: document.getElementById('v2-agents-rail'),
    projectsRail: document.getElementById('v2-projects-rail'),
    brainEntry: document.getElementById('v2-brain-entry'),
    insightsStrip: document.getElementById('v2-insights-strip'),
    goals: document.getElementById('v2-goals'),
    board: document.getElementById('v2-board'),
    needsMeNow: document.getElementById('v2-needs-me-now'),
    activityFeed: document.getElementById('v2-activity-feed'),
    peekPanel: document.getElementById('v2-peek-panel'),
    brainPanel: document.getElementById('v2-brain-panel'),
    goalProgress: document.getElementById('v2-goal-progress'),
    palette: document.getElementById('v2-palette'),
    batchBar: document.getElementById('v2-batch-bar'),
    toasts: document.getElementById('v2-toasts')
  };

  // topbar wiring that belongs to this shell, not a sibling module: the search
  // entry point opens the palette mount; palette.js/search.js do the rest.
  mounts.searchEntry.addEventListener('click', function () { emit('v2:palette:open', null); });
  mounts.brainEntry.addEventListener('click', function () { emit('v2:brain:open', {}); });

  // t-93: mode-switch (light/dark/system) — data-theme was already read by
  // every CSS rule in tokens.css/this file's own :root blocks, but nothing
  // ever SET it before this round; dark mode was reachable only by editing
  // the DOM by hand. Persisted under its own localStorage key (not
  // 'bureau_token', unrelated concern) so a choice survives reload.
  (function initModeSwitch() {
    var KEY = 'bureau_v2_theme';
    var saved = localStorage.getItem(KEY); // 'light' | 'dark' | null (system)
    function apply(mode) {
      if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
      else document.documentElement.removeAttribute('data-theme');
      document.querySelectorAll('.v2-modeswitch__btn').forEach(function (b) {
        b.classList.toggle('v2-on', b.getAttribute('data-mode') === (mode || 'system'));
      });
    }
    apply(saved);
    document.querySelectorAll('.v2-modeswitch__btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var mode = b.getAttribute('data-mode');
        if (mode === 'system') { localStorage.removeItem(KEY); apply(null); }
        else { localStorage.setItem(KEY, mode); apply(mode); }
      });
    });
  })();

  // t-93: sidebar nav (Board/Goals/Brain), converging toward the approved
  // t-58 sample's own top-of-rail structure. Board (default) keeps the
  // existing stacked main (insights + goals + board) exactly as it already
  // worked — this is additive chrome, not a removal of the insights-strip/
  // needs-me-now/activity-feed regions the acceptance says must keep
  // working. Goals gives goals a dedicated full view (hides insights +
  // board so the goal list/children get the room). Brain reuses the
  // existing brain-entry overlay-open behavior — one open path, not two.
  (function initNavTabs() {
    var tabs = { board: document.getElementById('v2-nav-board'), goals: document.getElementById('v2-nav-goals'), brain: document.getElementById('v2-nav-brain') };
    function setView(view) {
      Object.keys(tabs).forEach(function (k) { tabs[k].classList.toggle('v2-on', k === view); tabs[k].removeAttribute('aria-current'); });
      tabs[view].setAttribute('aria-current', 'page');
      // goals is visible in BOTH the board view (today's stacked layout)
      // and its own dedicated view — only insights/board hide when Goals
      // is picked, giving the goal list the full-width room the sample's
      // own Goals tab implies.
      if (mounts.insightsStrip) mounts.insightsStrip.hidden = view === 'goals';
      if (mounts.board && mounts.board.closest('section')) mounts.board.closest('section').hidden = view === 'goals';
    }
    tabs.board.addEventListener('click', function () { setView('board'); });
    tabs.goals.addEventListener('click', function () { setView('goals'); });
    tabs.brain.addEventListener('click', function () { emit('v2:brain:open', {}); });
  })();

  // t-87: window.BureauV2 is assigned HERE, inside boot(), not at module-
  // init time above — boot() only ever runs after the token gate has
  // passed (see the two call sites below: immediately, if a token was
  // already in localStorage, or from the gate form's own submit handler).
  // Before this fix the freeze happened unconditionally at module scope,
  // so a sibling module's bare `if (window.BureauV2)` readiness check
  // (keyboard.js, palette.js, peek-panel.js, media.js and others all use
  // this exact pattern) could see a truthy-but-not-ready BureauV2 and
  // fire init() before boot() had ever run — .token was still '' and
  // .state still null. t-68 hit this directly as a reproducible pre-gate
  // 401 reload loop. Each of those modules' own ready() helper already
  // polls (`if (window.BureauV2) return cb(); ... else setTimeout(poll,
  // 50)`), so moving the assignment here — rather than editing every
  // sibling's own check — is the clean fix: window.BureauV2 now simply
  // does not exist until the gate is behind us, and their existing poll
  // naturally waits it out instead of firing early.
  function boot() {
    window.BureauV2 = Object.freeze({
      get state() { return liveState; },
      get token() { return TOKEN; },
      get live() { return sseLive; },
      api: apiCall,
      refresh: refresh,
      on: on,
      emit: emit,
      bus: bus,
      mounts: mounts,
      // t-93 round 4: a mutable contract slot, same shape as `mounts` —
      // Object.freeze is shallow, so this plain object's OWN properties
      // stay assignable even though BureauV2 itself can never gain or lose
      // a top-level key. peek-panel.js (t-64) fills this in with
      // { registerSection, refreshSections } once it boots; sibling
      // modules (media.js today) attach a panel section here instead of
      // fighting peek-panel.js's own innerHTML rebuilds from outside.
      peekPanel: {}
    });
    updateViewport();
    refresh().then(function () { emit('v2:ready', undefined); });
    connectSSE();
    setInterval(refresh, 60000); // unconditional poll backstop — survives an SSE drop unchanged
  }

  if (TOKEN) { boot(); } else { showGate(false); }
})();
</script>

  status-glyph, tabular-number formatting, panel chrome helpers other
  modules import), then each i1-i10 module. A 404 here is expected and
  harmless until that sibling mission lands (see §6).
-->
