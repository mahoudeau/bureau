<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empty slot, Bureau</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1b22">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  /* Draft for LB9: an empty cartridge slot. Layout only; the cartridge
     itself is the shared .cartridge from site.css. */
  html { scroll-snap-type: none; }
  .nf {
    min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: center;
    gap: 22px; padding: 32px 16px; text-align: center;
    background: radial-gradient(ellipse 70% 60% at 50% 42%, var(--desk-hi), transparent 70%), var(--desk);
  }
  .nf .cartridge { --cu: min(3.2px, 0.6vh); --lb: #2a2833; --lband: var(--bezel); --lt: var(--plastic); }
  .nf .label { justify-content: flex-end; }
  .nf .label i { flex: 1; display: grid; place-items: center; font-style: normal; font-family: 'OfficePixel', monospace; font-size: calc(var(--cu) * 12); color: var(--bezel-hi); }
  .nf h1 { margin: 0; font-family: 'OfficePixel', monospace; font-weight: normal; font-size: 22px; letter-spacing: .06em; }
  .nf p { margin: 0; max-width: 32ch; color: #b9b6c4; line-height: 1.4; }
  .nf a { color: #ffd27a; font-size: 18px; }
  .nf a:focus-visible { outline: 3px solid #ffd27a; outline-offset: 3px; }
</style>
</head>
<body>
<main class="nf">
  <span class="cartridge" aria-hidden="true"><span class="shell"></span><span class="grip">BUREAU</span><span class="ridges"></span>
    <span class="label"><i>?</i><b>404</b></span><span class="arrow"></span></span>
  <h1>EMPTY SLOT</h1>
  <p>No cartridge at this address. It moved, or it never shipped.</p>
  <a href="/">Back to the handheld</a>
</main>
</body>
</html>
